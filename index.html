    if (global.console) console.error(e);
  }
  drawRail(); save();
  demoBtnMake();
  if (!quiet) storyBits();
}

/* ---------------- 조작판을 무대 안으로 ----------------
   **루키랩은 무대 하나 안에서 다 끝난다.** 판이 무대 위에 겹쳐 뜨고, 옆 날개는 읽는 것만 담는다.
   가상실험은 조작이 오른쪽 날개에 있어서 「눈은 무대, 손은 날개」로 갈라졌다.

   장면 열두 개 × 여섯 편의 mount() 를 뜯지 않고 이 문제를 없애려고,
   **엔진이 카드를 갈라 놓는다.** 장면은 예전처럼 #panel 에만 담으면 되고,
   그중 **누를 것이 든 카드만** 무대 안 조작판(#ctrl)으로 옮긴다. 나머지 읽는 카드는 날개에 남는다.

   [주의] 장면이 render() 로 #panel 을 다시 그리는 일이 잦다. 그래서 지켜보다가 다시 가른다.
   - 우리가 옮기느라 생긴 변화까지 보면 끝없이 돈다 → takeRecords 로 버린다
   - #panel 에서 무언가 **빠진** 변화면 장면이 다시 그리는 중이므로 조작판도 비우고 새로 담는다
     (그냥 두면 지난 판의 카드가 남는다) */
var ctrlObs = null, ctrlMoving = false, ctrlQueued = false, ctrlHard = false;

/* 누를 것이 들어 있는가. 이게 「조작」과 「읽는 것」을 가르는 기준이다.
   **체크리스트(.chk)도 조작판으로 보낸다.** 누를 것은 없지만 「지금 무엇을 해야 하는지」를
   말해 주는 길잡이라, 날개로 밀려나면 학생이 못 본다. 실제로 그랬다. */
var CTRL_SEL = 'button,input,select,textarea,.opt,.tool,.qz,[data-op],[data-dep],[data-keep],[data-fill],[data-read]';
function isCtrlCard(card) {
  /* 결과 카드(.result)는 누를 것이 없지만 무대 안 조작판에 둔다 — 폭죽 바로 아래,
     폰에서도 화면을 안 내려도 보이게. */
  return !!card.querySelector(CTRL_SEL) || !!card.querySelector('.chk') || card.classList.contains('result');
}
/* 든 조작이 **전부 잠겨 있는** 카드인가. 그러면 지금 단계 것이 아니다. */
function isLaterCard(card) {
  var ctl = card.querySelectorAll(CTRL_SEL);
  if (!ctl.length) return false;
  for (var i = 0; i < ctl.length; i++) if (!ctl[i].disabled) return false;
  return true;
}

function makeCtrl(stage) {
  if (ctrlObs) { ctrlObs.disconnect(); ctrlObs = null; }
  var oldc = $('#ctrl'); if (oldc && oldc._ao) { try { oldc._ao.disconnect(); } catch (e) {} }
  var c = el('div', { cls: '' });
  c.id = 'ctrl';
  stage.appendChild(c);
  var panel = $('#panel');
  ctrlObs = new MutationObserver(function (recs) {
    if (ctrlMoving) return;
    for (var i = 0; i < recs.length; i++) if (recs[i].removedNodes.length) ctrlHard = true;
    if (ctrlQueued) return;
    ctrlQueued = true;
    requestAnimationFrame(function () {
      ctrlQueued = false;
      var hard = ctrlHard; ctrlHard = false;
      splitPanel(hard);
    });
  });
  ctrlObs.observe(panel, { childList: true });
  /* 조작이 잠기거나 풀리면(disabled 가 바뀌면) 차례와 접기를 다시 매긴다. 높이는 안 건드린다. */
  var ao = new MutationObserver(function () { if (!ctrlMoving) orderCtrl(); });
  ao.observe(c, { attributes: true, attributeFilter: ['disabled'], subtree: true });
  c._ao = ao;
}

function splitPanel(hard) {
  var panel = $('#panel'), ctrl = $('#ctrl');
  if (!panel || !ctrl) return;
  ctrlMoving = true;
  if (hard) ctrl.innerHTML = '';
  Array.prototype.slice.call(panel.children).forEach(function (card) {
    if (isCtrlCard(card)) ctrl.appendChild(card);
  });
  /* 확인 문항 길잡이 카드는 장면 카드가 아니라 엔진 것이다. hard 로 비웠으면 다시 넣는다
     (정리 장면에서 이 카드가 사라져 「정리 문항 풀기」가 안 보였다) */
  if (QZ.card && qzHas() && QZ.card.parentNode !== ctrl) ctrl.appendChild(QZ.card);
  orderCtrl();
  if (ctrlObs) ctrlObs.takeRecords();     /* 우리가 만든 변화는 버린다 */
  ctrlMoving = false;
}

/* ② 조작판 안 차례와 접기.
   체크리스트(길잡이) → 지금 쓸 수 있는 조작 → 아직 못 쓰는 조작(접힘) 순서다.
   「접안렌즈를 끼우세요」 단계에 초점 막대가 맨 위에 크게 떠 있던 것을 이걸로 고쳤다. */
function orderCtrl() {
  var ctrl = $('#ctrl'); if (!ctrl) return;
  ctrlMoving = true;
  var cards = Array.prototype.slice.call(ctrl.children);
  cards.forEach(function (c) {
    if (c.classList.contains('qzcard')) return;
    var steps = !!c.querySelector('.chk');
    c.classList.toggle('steps', steps);
    c.classList.toggle('later', !steps && isLaterCard(c));
  });
  /* 확인 문항 길잡이 카드 — 풀 차례면 맨 위, 아니면 맨 아래 */
  var rank = function (c) {
    if (c.classList.contains('qzcard')) return c.classList.contains('pend') ? -1 : 1.5;
    return c.classList.contains('steps') ? 0 : c.classList.contains('later') ? 2 : 1;
  };
  var sorted = cards.slice().sort(function (a, b) { return rank(a) - rank(b); });
  var changed = sorted.some(function (c, i) { return c !== cards[i]; });
  if (changed) sorted.forEach(function (c) { ctrl.appendChild(c); });
  ctrlMoving = false;
}

/* 조작판 높이를 **장면마다 한 번** 정한다.
   내용을 따라가게 두면 단추를 누를 때마다 판이 커졌다 작아지고 위 그림이 튄다.
   그렇다고 늘 40% 로 박아 두면 막대 하나뿐인 장면에서 자리를 버린다.
   그래서 **접힌 카드까지 다 편 높이**를 재서 그 크기로 고정한다. 나중에 카드가 펴져도 자리가 있다. */
function sizeCtrlOnce() {
  var stage = $('#stage'), ctrl = $('#ctrl'); if (!stage || !ctrl) return;
  if (!ctrl.children.length) { ctrl.style.flexBasis = ''; return; }
  var laters = Array.prototype.slice.call(ctrl.querySelectorAll('.card.later'));
  laters.forEach(function (c) { c.classList.remove('later'); });
  /* 확인 문항 길잡이 카드(qzcard)는 자리를 미리 잡지 않는다 — 폰에서 70px 을 그림에서 뺏는다.
     손일이 끝나 나타날 때는 맨 위에 오므로 판이 굴러가도 그 카드는 보인다 */
  ctrl.style.flexBasis = 'auto';
  var need = ctrl.scrollHeight + 2;
  laters.forEach(function (c) { c.classList.add('later'); });
  var H = stage.getBoundingClientRect().height || 1;
  /* max-height 를 % 로 두면 getComputedStyle 이 「46%」라는 **글자**를 돌려준다.
     parseFloat 하면 46(px) 이 되어 상한이 46px 로 잡힌다. 실제로 그래서 판이 최소치에 붙었다.
     % 면 무대 높이에 곱해서 px 로 만든다. */
  var mh = getComputedStyle(ctrl).maxHeight, cap;
  if (/%$/.test(mh)) cap = H * parseFloat(mh) / 100;
  else cap = parseFloat(mh) || H * 0.4;
  var lo = Math.round(H * 0.18);
  ctrl.style.flexBasis = Math.max(lo, Math.min(cap, need)) + 'px';
}

/* ==================== 재미 층 ====================
   「첫 버전(루키랩)만큼 재미가 없다」 — 맞는 말이었다. 절차만 있고 **되돌아오는 것**이 없었다.
   루키랩에서 재미를 만들던 것 다섯을 엔진 한 곳에 넣어 여섯 편이 다 받게 한다.
     소리      맞으면 띵, 틀리면 부웅, 장면을 마치면 팡파르 (루키랩 beep 이식, ♪ 로 끈다)
     폭죽      무대 위 투명 캔버스 한 장. 장면을 마치면 터지고 「+50」이 떠오른다
     점수      상단바 칩. 장면 완료 +50, 문항 첫 번 정답 +30(아니면 +10), 실수 -5
     선임 반응  맞으면 얼굴이 통통 튀고 틀리면 흔들린다
     결과 카드  마지막 장면에 등급 S/A/B/C, 실수, 걸린 시간, 선임 한마디
   목숨과 제한 시간은 넣지 않았다. 이쪽은 「정석 실험」이라 서두르게 하면 안 된다. */
var AC = null, sndOn = true, gateWasLocked = false, funBound = false;
var fxCv = null, fxCtx = null, parts = [], fxRaf = 0, fxLast = 0, lastGoAt = 0;
try { sndOn = localStorage.getItem('vlab_snd') !== '0'; } catch (e) {}

function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
  return AC;
}
/* pick · good · bad · clear(팡파르 짧게) · fanfare(끝) */
function beep(type) {
  if (!sndOn) return;
  var c = ac(); if (!c) return;
  var t = c.currentTime;
  function tone(f0, f1, dur, kind, vol, delay) {
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = kind || 'triangle';
      o.frequency.setValueAtTime(f0, t + (delay || 0));
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + (delay || 0) + dur);
      g.gain.setValueAtTime(0.0001, t + (delay || 0));
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t + (delay || 0) + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (delay || 0) + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t + (delay || 0)); o.stop(t + (delay || 0) + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur, vol) {
    try {
      var n = c.sampleRate * dur, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1400;
      g.gain.value = vol || 0.10;
      src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
    } catch (e) {}
  }
  if (type === 'pick') tone(660, 990, 0.10, 'square', 0.11);
  else if (type === 'good') { tone(720, 1080, 0.09, 'triangle', 0.15); tone(1080, 1440, 0.12, 'triangle', 0.12, 0.07); }
  else if (type === 'bad') { tone(220, 90, 0.26, 'sawtooth', 0.14); noise(0.16, 0.09); }
  else if (type === 'clear') { tone(523, 523, 0.10, 'triangle', 0.15); tone(659, 659, 0.10, 'triangle', 0.15, 0.10); tone(784, 1046, 0.22, 'triangle', 0.16, 0.20); }
  else if (type === 'tick') tone(1900, 1500, 0.025, 'square', 0.045);
  else if (type === 'snap') { tone(1400, 800, 0.035, 'square', 0.13); tone(2400, 1700, 0.05, 'square', 0.10, 0.05); }
  else if (type === 'thud') { tone(150, 55, 0.2, 'sine', 0.22); noise(0.09, 0.07); }
  else if (type === 'whoosh') noise(0.2, 0.06);
  else if (type === 'fanfare') {
    [[523, 0], [659, .12], [784, .24], [1046, .36], [1318, .52]].forEach(function (p) { tone(p[0], p[0], 0.18, 'triangle', 0.15, p[1]); });
    tone(1568, 1568, 0.5, 'triangle', 0.12, 0.7);
  }
}
function sndToggle() {
  sndOn = !sndOn;
  try { localStorage.setItem('vlab_snd', sndOn ? '1' : '0'); } catch (e) {}
  sndPaint();
  if (sndOn) beep('pick');
}
function sndPaint() {
  var b = $('#btnSnd'); if (!b) return;
  b.classList.toggle('off', !sndOn);
  b.title = sndOn ? '효과음 끄기' : '효과음 켜기';
}

/* ---- 폭죽 ---- */
function fxAttach(play) {
  parts = [];
  fxCv = el('canvas', { cls: 'fxc' }); fxCtx = fxCv.getContext('2d');
  play.appendChild(fxCv);          /* 장면 캔버스 **뒤에** 붙는다. 검사는 첫 캔버스를 잡는다 */
  fxFit();
}
function fxFit() {
  if (!fxCv) return;
  var r = fxCv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  fxCv.width = Math.max(1, Math.round(r.width * dpr)); fxCv.height = Math.max(1, Math.round(r.height * dpr));
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxCv._w = r.width; fxCv._h = r.height;
}
function burst(x, y, col, n, spd) {
  if (!fxCv) return;
  n = n || 16;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.283, v = (spd || 3.2) * (0.4 + Math.random());
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.4,
      r: 3 + Math.random() * 5, life: 1, col: col || ['#ffd23f', '#4cc9f0', '#5fd68a', '#ff5c5c', '#9b6dff'][i % 5],
      shape: Math.random() < .4 ? 1 : 0 });
  }
  fxRun();
}
function ripple(x, y, col) {
  if (!fxCv) return;
  parts.push({ ring: 1, x: x, y: y, r: 8, life: 1, col: col || 'rgba(255,210,63,.9)' });
  fxRun();
}
function pop(x, y, text, col, big) {
  if (!fxCv) return;
  parts.push({ pop: 1, x: x, y: y, vy: -0.9, life: 1.4, text: text, col: col || '#181322', big: !!big });
  fxRun();
}
function fxRun() {
  if (fxRaf) return;

  fxRaf = requestAnimationFrame(fxFrame);
}
function fxFrame(now) {
  fxRaf = 0;
  if (!fxCv || !fxCtx) return;
  var dt = Math.max(0, Math.min(0.05, (now - fxLast) / 1000)); fxLast = now;   /* 뒤 탭에서 now 가 거꾸로 오면 음수 → 물결 반지름 음수 → arc 예외 */
  fxFit();

  c.clearRect(0, 0, W, H);
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt * (p.pop ? 0.9 : p.ring ? 3.2 : 1.5);
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.ring) {
      p.r += 140 * dt;
      c.save(); c.globalAlpha = Math.max(0, p.life) * 0.9;
      c.strokeStyle = p.col; c.lineWidth = 3.5;
      c.beginPath(); c.arc(p.x, p.y, Math.max(0.5, p.r), 0, 6.283); c.stroke();
      c.restore();
      continue;
    }
    if (p.pop) {
      p.y += p.vy;
      c.save(); c.globalAlpha = Math.max(0, Math.min(1, p.life));
      var sz = p.big ? 34 : 24;
      var k = Math.max(0, 1.4 - p.life);              /* 막 태어났을 때 잠깐 커졌다 준다 */
      var sc = k < .12 ? 0.6 + k / .12 * 0.7 : k < .3 ? 1.3 - (k - .12) / .18 * .3 : 1;
      c.font = '900 ' + sz + 'px "Malgun Gothic",sans-serif'; c.textAlign = 'center';
      /* 폰에서 큰 글자가 화면 밖으로 나가지 않게 — 폭에 맞춰 줄이고, 가운데도 안쪽으로 */
      var tw = c.measureText(p.text).width;
      if (tw * sc > W - 16) sc *= (W - 16) / (tw * sc);
      var px = Math.max(tw * sc / 2 + 8, Math.min(W - tw * sc / 2 - 8, p.x));
      c.translate(px, p.y); c.scale(sc, sc); c.translate(-p.x, -p.y);
      c.lineWidth = 6; c.strokeStyle = '#fff8e6'; c.strokeText(p.text, p.x, p.y);
      c.fillStyle = p.col; c.fillText(p.text, p.x, p.y);
      c.restore();

    }
    p.vy += 6 * dt; p.x += p.vx; p.y += p.vy;
    c.save(); c.globalAlpha = Math.max(0, Math.min(1, p.life));
    c.fillStyle = p.col; c.strokeStyle = '#181322'; c.lineWidth = 1.6;
    c.beginPath();
    if (p.shape) c.rect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    else c.arc(p.x, p.y, p.r * Math.max(.2, p.life), 0, 6.283);
    c.fill(); c.stroke(); c.restore();
  }
  if (parts.length) fxRaf = requestAnimationFrame(fxFrame);
  else c.clearRect(0, 0, W, H);
}

var WIPED = 0;
(function () {
  var q = (global.location && location.search) || '';

  var asked = false, kept = [];

    else kept.push(p);

    }

})();

    mount: function (stage, panel) {

        var any = D.vars.op || D.vars.dep || CTL_LIST.some(function (o) { return D.vars.ctl[o.id]; });
        var msg = [];
        if (!opOK && D.vars.op) msg.push('조작변인이 아직 맞지 않습니다. 세 발효관에서 <b>일부러 다르게 한 것</b>은 무엇인가요?');
        if (!depOK && D.vars.dep) msg.push('종속변인이 아직 맞지 않습니다. 이 실험에서 <b>측정하는 값</b>은 무엇인가요?');
        if (!ctlOK && any) msg.push('통제변인이 아직 맞지 않습니다. <b>조작변인은 통제변인이 될 수 없습니다.</b>');
        fb.innerHTML = !any ? ''
          : (opOK && depOK && ctlOK)
            ? '<div class="why"><b>맞습니다.</b> 조작변인은 호흡기질의 종류, 종속변인은 맹관부에 모인 기체의 부피입니다. ' +
              '효모액의 양, 용액의 전체 부피, 온도, 발효 시간은 세 발효관에서 모두 같게 맞춥니다.</div>'
            : '<div class="why bad">' + msg.join('<br>') + '</div>';
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (opOK && depOK && ctlOK) E.note('변인 설정',
          '조작변인 — 호흡기질의 종류\n종속변인 — 맹관부에 모인 기체의 부피\n' +
          '통제변인 — 효모액의 양, 용액의 전체 부피, 온도, 발효 시간');
        E.gate(opOK && depOK && ctlOK && qok,
          (opOK && depOK && ctlOK) ? '확인 문항을 풀어야 넘어갑니다' : '변인을 모두 바르게 정하세요');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 5. 발효관에 넣을 용액의 양 정하기 (교과서 99쪽 2)
   ================================================================ */
function scPlan() {
  /* 2026-11-04 사용자: 「시험관마다 세팅을 아래 스크롤로 하는 게 불편하다. 시험관 바로 옆에 버튼을」.
     조절 단추를 조작판에서 **무대 위 각 발효관 옆**으로 옮겼다.
     넓은 무대 — 세 관을 나란히, 관마다 오른쪽에 조절판.
     좁은 무대(폰) — 위의 A B C 칩으로 관 하나를 골라 크게, 그 오른쪽에 조절판. */
  var SHORT = { water: '증류수', glucose: '포도당', starch: '녹말' };
  var PW = 196;                                   /* 조절판 폭(px) */
  /* 관마다 맡은 일 — 조절판 맨 위 띠(2026-11-04 사용자: 어느 관이 대조군이고 어디에 무엇을 넣는지 보이게) */
  var ROLE = {
    A: { t: '대조군 — 증류수', col: '#cfe6fa' },
    B: { t: '실험군 — 5 % 포도당 용액', col: '#ffd23f' },
    C: { t: '실험군 — 5 % 녹말 용액', col: '#ece2c8' }
  };
  return {
    id: 'plan', chap: '실험 설계', name: '용액의 양 정하기',
    guide: '<b>A는 대조군(증류수), B는 5 % 포도당 용액, C는 5 % 녹말 용액</b>입니다. 발효관 옆 단추로 효모액은 <b>모두 같은 양</b>, ' +
           '나머지 용액으로 <span class="hl">전체 부피를 35 mL 로 맞춥니다.</span>',
    mount: function (stage, panel) {
      var P = D.plan;
      var st = { sel: 'A', pressAt: {}, tNow: 0 };
      var cv = E.canvas(stage), M = { btn: [] };

      /* 자리 잡기 — 그리기와 누르기가 같이 쓴다(그리기가 멎어도 누른 자리가 맞게) */
      function layout(w, h) {
        var L = { btns: [], tubes: [] };
        var wideS = Math.min((h - 108) / 272, (w / 3 - PW - 40) / 150);
        L.wide = wideS >= .62 && h >= 300;
        var keys = L.wide ? KEYS : [st.sel];
        /* 좁으면 관은 왼쪽 기둥(위는 「실험 집중」 단추, 아래는 관 고르는 칩), 조절판은 오른쪽 위부터 */
        var top = 58;   /* 왼쪽 위 「실험 집중」 단추 아래부터 */
        var s = L.wide ? Math.min(wideS, 1.6) : Math.max(.3, Math.min((h - top - 52) / 272, (w - PW - 40) / 150));
        L.s = s;
        keys.forEach(function (k, i) {
          var colX = L.wide ? w * i / 3 : 0, colW = L.wide ? w / 3 : w;
          var tubeW = 150 * s, gap = 10;
          var x0 = colX + Math.max(8, (colW - tubeW - gap - PW) / 2);
          var cx = x0 + tubeW / 2, ty = top + 218 * s;
          var px = x0 + tubeW + gap;
          if (!L.wide) px = Math.max(px, w - PW - 14);
          var py = L.wide ? Math.max(top, ty - 218 * s + (272 * s - 222) / 2) : 10;
          L.tubes.push({ k: k, cx: cx, y: ty, px: px, py: py });
          /* 조절판 단추 — 효모액 ±, 용액 셋, 그 용액 ± */
          var bh = 36, bw = 44;
          L.btns.push({ k: k, a: 'y-', x: px + PW - 2 * bw - 6, y: py + 36, w: bw, h: bh, t: '－' });
          L.btns.push({ k: k, a: 'y+', x: px + PW - bw, y: py + 36, w: bw, h: bh, t: '＋' });
          ['water', 'glucose', 'starch'].forEach(function (sk, j) {
            var cw = (PW - 8) / 3;
            L.btns.push({ k: k, a: 'sol:' + sk, x: px + j * (cw + 4), y: py + 98, w: cw, h: bh, t: SHORT[sk] });
          });
          L.btns.push({ k: k, a: 'v-', x: px + PW - 2 * bw - 6, y: py + 140, w: bw, h: bh, t: '－' });
          L.btns.push({ k: k, a: 'v+', x: px + PW - bw, y: py + 140, w: bw, h: bh, t: '＋' });
          L.x0 = x0;
        });
        if (!L.wide) KEYS.forEach(function (k, i) {
          L.btns.push({ k: k, a: 'tab', x: 10 + i * 50, y: h - 46, w: 46, h: 38, t: k });
        });
        M.L = L; M.btn = L.btns;
        return L;
      }
      function btn(c, b, on, t, warn) {
        var pk = popK(t - (st.pressAt[b.k + b.a] == null ? -9 : st.pressAt[b.k + b.a]));
        c.save(); c.translate(b.x + b.w / 2, b.y + b.h / 2); c.scale(pk, pk); c.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
        rr(c, b.x + 3, b.y + 3, b.w, b.h, 10); c.fillStyle = 'rgba(0,0,0,.30)'; c.fill();
        rr(c, b.x, b.y, b.w, b.h, 10); c.fillStyle = on ? '#ff9f43' : warn ? '#ffe0df' : '#fff8e6'; c.fill();
        c.lineWidth = 2.6; c.strokeStyle = INK; c.stroke();
        c.font = '900 ' + (b.t.length > 2 ? 12.5 : 17) + 'px "Malgun Gothic","맑은 고딕",sans-serif';
        c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2 + .5);
        c.restore();
      }
      function txt(c, x, y, s, size, col, al) {
        c.save(); c.font = '900 ' + size + 'px "Malgun Gothic","맑은 고딕",sans-serif';
        c.fillStyle = col || INK; c.textAlign = al || 'left'; c.textBaseline = 'middle'; c.fillText(s, x, y); c.restore();
      }

      cv.on(function (c, w, h, t) {
        st.tNow = t;
        var L = layout(w, h);
        E.dbg = { n: 'plan', P: P, M: M, st: st };
        L.tubes.forEach(function (tb) {
          var k = tb.k, p = P[k], tot = p.y + p.v, s = L.s;
          drawFermTube(c, tubeX(tb.cx, s), tb.y, s, {
            filled: tot > 0, sol: p.sol || 'yeast', gas: 0, hi: tot === 35, k: Math.min(1, tot / 35)
          }, t);
          if (L.wide) chip(c, tb.cx, tb.y + 54 * s + 16, '발효관 ' + k + (k === 'A' ? ' (대조군)' : ''), tot === 35 ? '#5fd68a' : '#fff8e6', 12);
          /* 조절판 바탕 */
          var px = tb.px, py = tb.py;
          rr(c, px - 8, py - 6, PW + 16, 226, 14); c.fillStyle = 'rgba(255,255,255,.72)'; c.fill();
          c.lineWidth = 2; c.strokeStyle = 'rgba(24,19,34,.25)'; c.stroke();
          /* 맡은 일 띠 — 다른 용액을 고르면 빨개진다 */
          var wrong = p.sol && p.sol !== PLAN[k];
          rr(c, px, py, PW, 28, 10); c.fillStyle = wrong ? '#ff9a9a' : ROLE[k].col; c.fill();
          c.lineWidth = 2.6; c.strokeStyle = INK; c.stroke();
          txt(c, px + PW / 2, py + 14.5, k + ' ' + ROLE[k].t, 12, INK, 'center');
          txt(c, px, py + 46, '효모액', 12.5, '#5b6b80');
          txt(c, px, py + 64, p.y + ' mL', 16, p.y === YEAST_ML ? '#127a5a' : INK);
          txt(c, px, py + 87, '넣을 용액', 12.5, '#5b6b80');
          txt(c, px, py + 150, (p.sol ? SHORT[p.sol] : '그 용액'), 12.5, '#5b6b80');
          txt(c, px, py + 168, p.v + ' mL', 16, INK);
          var okT = tot === 35;
          rr(c, px, py + 186, PW, 26, 13); c.fillStyle = okT ? '#5fd68a' : tot ? '#ff9a9a' : '#fff8e6'; c.fill();
          c.lineWidth = 2.4; c.strokeStyle = INK; c.stroke();
          txt(c, px + PW / 2, py + 199, '전체 ' + tot + ' / 35 mL', 12.5, INK, 'center');
        });
        M.btn.forEach(function (b) {
          var p = P[b.k], on = false, warn = false;
          if (b.a.indexOf('sol:') === 0) on = p.sol === b.a.slice(4);
          if (b.a === 'tab') { on = st.sel === b.k; warn = !on && P[b.k].y + P[b.k].v !== 35; }
          if ((b.a === 'v-' || b.a === 'v+') && !p.sol) warn = true;
          btn(c, b, on, t, warn);
        });
        if (!M.L.wide) {
          var p0 = P[st.sel];
          if (p0.y + p0.v === 35 && p0.sol) {
            var nk = KEYS.filter(function (k) { return P[k].y + P[k].v !== 35 || !P[k].sol; })[0];
            if (nk) { var tb2 = M.btn.filter(function (b) { return b.a === 'tab' && b.k === nk; })[0]; if (tb2 && !E.demoBusy()) E.grab(c, tb2.x + tb2.w / 2, tb2.y + tb2.h / 2, 18, t); }
          }
        }
        var done = KEYS.filter(function (k) { return P[k].y + P[k].v === 35 && P[k].sol; }).length;
        E.hint(stage, M.L.wide ? '발효관 옆 단추로 맞추세요 — 세 발효관 모두 전체 35 mL (' + done + '/3)'
          : '관 ' + st.sel + ' 를 맞추고, 왼쪽 아래 A B C 로 관을 바꾸세요 (' + done + '/3)');
      });

      cv.cv.addEventListener('pointerdown', function (ev) {
        var p = cv.pt(ev);
        if (cv.w > 8) layout(cv.w, cv.h);
        for (var i = 0; i < M.btn.length; i++) {
          var b = M.btn[i];
          if (p.x < b.x - 4 || p.x > b.x + b.w + 4 || p.y < b.y - 4 || p.y > b.y + b.h + 4) continue;
          press(b, p); return;
        }
      });
      function press(b, p) {
        var k = b.k, pk = P[k];
        st.pressAt[k + b.a] = st.tNow; E.buzz(8);
        if (b.a === 'tab') { st.sel = k; E.beep('pick'); return; }
        if (b.a === 'y-' || b.a === 'y+') { pk.y = E.clamp(pk.y + (b.a === 'y+' ? 5 : -5), 0, 25); E.beep('tick'); }
        else if (b.a.indexOf('sol:') === 0) {
          pk.sol = b.a.slice(4); E.beep('pick'); E.ripple(p.x, p.y);
          /* 다른 용액을 골라도 점수는 안 깎는다. 띠와 말로 알려 주기만 한다 */
          if (pk.sol !== PLAN[k]) E.toast('발효관 ' + k + ' 는 ' + ROLE[k].t.replace(' — ', ', ') + ' 자리다. 띠를 봐라.');
        }
        else {
          if (!pk.sol) { E.toast('무엇을 넣을지부터 골라라. 양은 그다음이다.', 'bad'); return; }
          pk.v = E.clamp(pk.v + (b.a === 'v+' ? 5 : -5), 0, 25); E.beep('tick');
        }
        if (pk.y + pk.v === 35 && pk.sol) { E.beep('snap'); E.kick(); }
        E.save(); sync();
      }

      panel.innerHTML = '<div class="card"><h3>세 발효관 준비하기</h3>' +
        '<p>앞에서 고른 비교 조건을 바탕으로 A, B, C에 넣을 용액과 부피를 맞추세요.</p>' +
        '<p><b>A</b> 증류수(호흡기질이 없는 <b>대조군</b>), <b>B</b> 5 % 포도당 용액, <b>C</b> 5 % 녹말 용액</p>' +
        '<p class="muted">무대의 <b>발효관 옆 단추</b>로 정합니다. 효모액은 세 발효관에 <b>같은 양</b>을 넣습니다. ' +
        '통제변인이기 때문입니다. 나머지 한 가지 용액을 넣어 전체 부피도 세 발효관에서 같게 맞춥니다.</p>' +
        '<p class="muted">의뢰에서 살펴본 반죽에는 설탕이 들어갔습니다. 여기서는 <b>포도당</b> 용액을 써서 비교합니다.</p></div>';
      /* 각 발효관에 넣을 용액과 부피를 한 줄에 모은다. */
      var tb = E.el('div', { cls: 'card' });
      var tbBody = E.el('div'); tb.appendChild(E.el('h3', { text: '넣을 용액의 양 (mL)' })); tb.appendChild(tbBody);
      panel.appendChild(tb);
      var fb = E.el('div', { cls: 'card' });
      var fbBody = E.el('div'); fb.appendChild(fbBody); panel.appendChild(fb);

      function sync() {
        tbBody.innerHTML = '<div class="scroll"><table class="dat"><tr><th>발효관</th><th>효모액</th><th>비교할 용액</th><th>전체</th></tr>' +
          KEYS.map(function (k) {
            var pk = P[k], total = pk.y + pk.v;
            var sol = pk.sol ? SOLNAME[pk.sol] + ' ' + pk.v : '미선택';
            return '<tr><th scope="row">' + k + '</th><td>' + pk.y + '</td><td class="l">' + sol + '</td>' +
              '<td><b style="color:' + (total === 35 ? '#2e9e6b' : '#c0392b') + '">' + total + '</b></td></tr>';
          }).join('') + '</table></div>';
        var yeastSame = P.A.y === P.B.y && P.B.y === P.C.y && P.A.y > 0;
        var yeast15 = P.A.y === YEAST_ML && yeastSame;
        var totOK = KEYS.every(function (k) { return P[k].y + P[k].v === 35; });
        var solSet = KEYS.every(function (k) { return !!P[k].sol; });
        var solDiff = solSet && P.A.sol !== P.B.sol && P.B.sol !== P.C.sol && P.A.sol !== P.C.sol;
        var order = P.A.sol === 'water' && P.B.sol === 'glucose' && P.C.sol === 'starch';
        var ok = yeast15 && totOK && solDiff && order;
        var msg = [];
        if (!solSet) msg.push('세 발효관에 넣을 용액을 각각 고르세요.');
        else if (!solDiff) msg.push('세 발효관에 <b>서로 다른 용액</b>을 넣어야 호흡기질의 종류를 비교할 수 있습니다.');
        else if (!order) msg.push('세 용액을 바르게 골랐습니다. 발효관에 붙은 이름에 맞게 배치하세요. ' +
          'A는 증류수(대조군), B는 5 % 포도당 용액, C는 5 % 녹말 용액으로 맞추세요.');
        if (!yeastSame) msg.push('효모액은 <b>세 발효관에 같은 양</b>을 넣어야 합니다. 통제변인입니다.');
        else if (!yeast15) msg.push('효모액은 <b>15 mL</b> 로 맞추세요.');
        if (!totOK) msg.push('전체 부피가 세 발효관 모두 <b>35 mL</b> 가 되어야 합니다.');
        var any = KEYS.some(function (k) { return P[k].y || P[k].v || P[k].sol; });
        fbBody.innerHTML = !any
          ? '<h3>확인</h3><p class="muted">아직 아무것도 정하지 않았습니다.</p>'
          : ok
            ? '<h3>확인</h3><div class="why"><b>좋습니다.</b> 효모액 15 mL 로 같게, 전체 35 mL 로 같게 맞추고 ' +
              '호흡기질만 다르게 했습니다. 발효관 A는 호흡기질을 넣지 않은 <b>대조군</b>입니다.</div>'
            : '<h3>확인</h3><div class="why bad">' + msg.join('<br>') + '</div>';
        if (ok) E.note('실험 설계',
          '발효관 A — 효모액 15 mL + 증류수 20 mL (대조군)\n' +
          '발효관 B — 효모액 15 mL + 5 % 포도당 용액 20 mL\n' +
          '발효관 C — 효모액 15 mL + 5 % 녹말 용액 20 mL\n전체 부피는 모두 35 mL');
        E.gate(ok, '발효관 옆 단추로 바르게 맞추세요');
      }
      sync();
    }
  };
}


/* ================================================================
   장면 6. 기울여 채우기 (다시 지음, 교과서 98쪽 실험 방법 1)
   「발효관을 기울여 맹관부가 가득 차게 내용물을 넣는다.」
   ----------------------------------------------------------------
   ◆ 관을 잡고 돌린다. 손이 받침 목을 쥐고 들어 올린 채 시계 방향으로 눕는다.
   ◆ 60° 넘게 눕히면 스포이트를 입구에 꽂을 수 있다. 꽂히면 목과 같은 축으로 돈다.
   ◆ 꼭지를 누르고 있는 동안만 들어간다. 비면 한 번 눌러 비커에서 다시 담는다.
   ◆ 맹관부 끝이 굽은 곳보다 낮아져야(93°) 갇힌 공기가 방울로 빠져나간다.
   ◆ 입구보다 액면이 높아지면 넘친다(그 만큼 잃는다).
   값은 모두 벽시계로 센다(UI원칙 23). 그림은 그 값을 보고 그릴 뿐이다.
   ================================================================ */
function scFill() {
  var Q = {
    id: 'fm_tilt2',
    q: '발효관을 <b>맹관부 끝이 입구보다 낮아질 만큼</b> 눕혀서 내용물을 넣는 까닭으로 가장 알맞은 것은?',
    opts: [
      '용액이 발효관 밖으로 넘치지 않게 하려고',

function scMeasure() {

function arrow(c, x1, y1, x2, y2, on, col) {

  c.restore();
