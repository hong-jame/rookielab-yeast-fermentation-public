<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>효모의 알코올발효 실험하기</title>
<style>
/* ===== 가상실험실 공용 스타일 — 루키랩 시리즈 =====
   앞서 만든 「루키랩」과 같은 손에서 나온 것으로 보이도록 그쪽의 시각 언어를 그대로 가져왔다.
     굵은 검은 테두리(4px) + 흐리지 않은 하드 섀도우(5px 5px 0) + 납작한 색
     제목은 글자 테두리(-webkit-text-stroke)로 만화 간판처럼
     누르면 그림자만큼 눌려 들어간다(:active 에서 translate + 그림자 0)
   색 이름도 루키랩과 같다. ink / paper / sun / sky / grass / blood / grape.

   **선택자는 하나도 바꾸지 않았다.** 실험 모듈 여섯 편이 이 이름들을 그대로 쓴다.
   실험별로 바뀌는 것은 --acc(채움색)와 --acc2(그 위에 얹는 진한 글자색) 둘뿐이다.

   무대(#stage)는 어둡게 둔다. 그 안의 캔버스가 현미경 시야와 시약 색을 그리는 자리라
   관찰 정확도가 걸려 있어 만화색으로 칠하지 않는다. 테두리만 두껍게 둘렀다. */

:root{
  --hintzone:52px;

  --ink:#181322;
  --paper:#fff8e6;
  --sun:#ffd23f;
  --sun2:#f0a71a;
  --sky:#4cc9f0;
  --grass:#5fd68a;
  --blood:#ff5c5c;
  --grape:#9b6dff;

  --bg:#14101f;
  --bg2:#1d1830;
  --panel:var(--paper);
  --ink2:#6b6480;
  --line:#e3dcc9;
  --acc:#ffd23f;
  --acc2:#8a5f00;
  --warn:#f0a71a;
  --bad:#ff5c5c;
  --good:#2b8a3e;
  --bench:#2a3550;

  --l:4px;
  --l-sm:3px;
  --sh:5px 5px 0 var(--ink);
  --sh-sm:3px 3px 0 var(--ink);
  --r:16px;
  --bar:58px;
  --rail:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-weight:700;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;font-weight:800}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding-left:1.15em}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* 무대를 크게 보는 동안은 날개를 접는다 — 현미경에서 세포를 눌러 표시할 때 쓴다 */
#app.big #side{display:flex;flex:0 0 auto}
#app.big #main{flex-direction:column}
#app.big #guide,#app.big #panel{display:none}
#app.big #stage{flex:1 1 auto !important;height:auto !important;max-height:none;min-height:0}
/* 조작판도 줄인다. 안 줄이면 무대가 화면의 58 % 밖에 안 되어 크게 본 보람이 없다.
   ⚠ **여기서 퍼센트를 쓰면 안 된다.** 무대 높이가 flex 로 정해져 기준이 없다고 보아
   26 % 가 「내용 높이」로 풀렸고, 조작판이 무대를 통째로 밀어내 #play 가 0 이 됐다. px 로 못 박는다 */
#app.big #ctrl{flex:0 1 auto !important;max-height:200px !important}
#app.big #play{flex:1 1 auto !important;min-height:180px}
#bigBtn{
  position:absolute;left:10px;top:10px;z-index:7;
  min-height:38px;padding:0 13px;border-radius:12px;
  font-size:13px;font-weight:900;color:var(--ink);
  background:var(--paper);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  display:none;align-items:center;gap:5px;
}
#bigBtn.on{display:inline-flex}
#bigBtn{display:inline-flex;min-height:44px}
#bigBtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
/* 루키랩과 같은 점무늬 바탕 */
#app::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);
  background-size:18px 18px;
}
#bar,#rail,#main{position:relative;z-index:1}

/* 상단바와 단계 띠도 기둥과 같은 폭으로 묶는다.
   본문만 좁히고 머리는 화면 전체 폭으로 두었더니 **머리와 몸이 따로 놀아** 보였다.
   셋이 같은 폭이어야 한 장의 카드로 읽힌다. */
/* 상단바와 단계 띠는 화면 전체 폭이다. 무대가 넓어졌으니 머리도 같이 넓다.
   (한 기둥 시절에는 500px 로 묶었고, 그때 메뉴 글자가 「실 험 소 개」처럼 쪼개져 아이콘만 남겼다.
    지금은 넓은 화면에서 글자를 다시 보인다. 좁은 화면에서만 아이콘만 남긴다.) */

/* ---------- 재미 층 ---------- */
#score{
  flex:0 0 auto;margin-left:8px;padding:2px 10px;border-radius:999px;
  background:var(--sun);color:var(--ink);border:var(--l-sm) solid var(--ink);
  font-size:12.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;
}
#score.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
#btnSnd.off .mi{opacity:.35;text-decoration:line-through}
canvas.fxc{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--hintzone));pointer-events:none;z-index:2}
#guideFace.joy{animation:joy .7s ease}
#guideFace.oops{animation:oops .6s ease}
@keyframes joy{0%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
@keyframes oops{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#btnNext.go{animation:go 1.1s ease-in-out infinite}
@keyframes go{0%,100%{box-shadow:var(--sh);transform:none}50%{box-shadow:0 0 0 6px rgba(95,214,138,.45),var(--sh);transform:translateY(-2px)}}
/* 결과 카드 — 루키랩 결과 화면의 큰 등급 글자 */
.card.result{text-align:center;background:#fff}
.card.result .grade{
  display:inline-block;font-size:64px;line-height:1;font-weight:900;color:var(--sun);
  -webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);margin:4px 0 6px;
}
.card.result .grade.pop{animation:gradepop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes gradepop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.card.result .rows div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:2px dashed var(--line);font-size:13.5px}
.card.result .rows div:last-child{border-bottom:0}
.card.result .word{margin:10px 0 0;font-size:13.5px;line-height:1.6;text-align:left;background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:12px;padding:8px 12px}

/* ---------- 상단바 ---------- */
#bar{
  height:var(--bar);flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--ink);
  border-bottom:var(--l) solid var(--ink);color:var(--paper);
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
}
#brand{display:flex;align-items:center;gap:10px;min-width:0}
/* 시리즈 배지 — 이 도구가 루키랩의 다음 것이라는 표시 */
#badge{
  flex:0 0 auto;font-size:11.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;
  background:var(--sun);color:var(--ink);border:var(--l-sm) solid var(--ink);
  border-radius:999px;padding:3px 11px;box-shadow:var(--sh-sm);
}
#ttl{
  font-size:17px;font-weight:900;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;
}
#menu{margin-left:auto;display:flex;gap:7px}
#menu button{
  /* 폰에서 손가락으로 누르는 것이라 높이를 44 px 로 잡는다.
     폭은 못 늘린다 — 단추 여섯을 한 줄에 놓아야 하고 더 넓히면 제목이 사라진다 */
  min-height:44px;
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;
  background:var(--paper);color:var(--ink);font-size:13px;font-weight:900;
  border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
#menu button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#menu .mi{font-size:13px}

/* ---------- 진행 레일 ---------- */
#rail{
  height:var(--rail);flex:0 0 auto;display:flex;align-items:center;gap:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  background:var(--bg2);border-bottom:var(--l) solid var(--ink);padding:0 12px;
}
#rail::-webkit-scrollbar{display:none}
.rl{
  /* 레일 높이(--rail 48)는 그대로 두고 눌리는 칸만 40 px 로 키운다. 무대 높이를 안 뺏는다 */
  min-height:40px;
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
  padding:4px 13px 4px 5px;border-radius:999px;margin-right:5px;
  color:#a99fc4;font-size:12.5px;font-weight:900;white-space:nowrap;
  background:transparent;transition:.14s;
}
.rl .dot{
  width:22px;height:22px;border-radius:8px;flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;font-weight:900;
  background:#2c2444;color:#a99fc4;border:2.5px solid #3d3459;
}
.rl.on{background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);box-shadow:var(--sh-sm);padding:2px 11px 2px 3px}
.rl.on .dot{background:var(--ink);color:var(--sun);border-color:var(--ink)}
.rl.fin{color:var(--grass)}
.rl.fin .dot{background:var(--grass);color:var(--ink);border-color:var(--ink)}
.rl.fin .dot::after{content:"✓"}
.rl.fin .dot span{display:none}
.rl+.rl::before{content:"";width:12px;height:3px;background:#3d3459;margin-right:5px;border-radius:2px}

/* ---------- 본체 ---------- */
/* ===== 한 기둥 =====
   **조작판을 무대 오른쪽 날개에 두었더니 눈과 손이 갈라졌다.**
   루키랩은 무대 하나 안에서 다 끝난다 — 판이 무대 위에 겹쳐 뜨고, 옆 날개는 읽는 것만 담는다.
   그래서 「메인창과 날개창이 따로 논다」는 말이 나왔다. 겉모습이 아니라 뼈대 문제다.

   장면 열두 개 × 여섯 편의 mount() 를 다 뜯는 대신, **배치만 한 기둥으로** 바꿨다.
   무대 바로 아래에 조작판이 붙어 시선이 건너뛰지 않는다. 선택자는 그대로라 모듈은 안 고쳤다.
   폭은 휴대폰 비율로 잡되 화면 높이를 따라 커진다(루키랩이 420x820 을 키워 쓰는 것과 같은 셈). */
/* ===== 배치 =====
   넓은 화면: [ 무대(그림 + 무대 안 조작판) | 읽는 날개 386px ]
   좁은 화면: 무대 위, 날개 아래 (세로 한 기둥)

   [왜 이렇게 됐나]
   처음엔 조작이 오른쪽 날개에 있어 눈과 손이 갈라졌다. 그래서 루키랩처럼 「한 기둥」으로
   묶었는데, 루키랩은 420 폭에 맞춰 그린 그림이고 가상실험은 넓은 무대에 맞춰 그린 그림이라
   **PC 에서 그림이 지난 판의 6분의 1 로 쪼그라들었다**(490x243). 현미경이 손톱만 해졌다.
   그래서 되돌렸다 — 무대는 넓게(그림에 맞게), 조작은 무대 **안** 아래쪽에(루키랩처럼),
   날개에는 읽는 것만. 그림도 돌아오고 손도 무대에 남는다. */
#main{flex:1 1 auto;display:flex;flex-direction:row;min-height:0;width:100%}
#stage{
  display:flex;flex-direction:column;
  /* 넓은 화면에서 무대는 날개를 뺀 폭을 다 쓰고 높이도 다 쓴다. 그림이 커야 실험이다. */
  flex:1 1 auto;height:auto;min-height:0;
  position:relative;min-width:0;overflow:hidden;
  border-right:var(--l) solid var(--ink);
  /* 루키랩 연구실 벽 색. 모듈이 안 칠한 자리에 이게 비친다.
     실험대 띠를 넣어 봤더니 **그래프와 모식도 장면을 뜬금없이 가로질렀다.** 벽만 둔다. */
  background:linear-gradient(180deg,#eef6fc 0%,#e2eef8 100%);
}
#side{
  /* 읽는 날개. 선임 한 마디, 읽는 카드, 이전/다음. **조작은 여기 없다.** */
  flex:0 0 386px;display:flex;flex-direction:column;min-height:0;
  background:var(--panel);
}

/* 안내 말풍선 — 루키랩의 아래 대사와 같은 모양 */
/* 루키랩의 아래 대사와 같은 짜임 — 얼굴 상자 + 흰 말풍선 */
/* 선임 한 마디 — **루키랩 말풍선급으로 키웠다.** 76px 짜리 띠였을 때 「대화창이 너무 작다」는
   말이 나왔다. 얼굴이 크고 글자가 커야 사람이 말하는 것으로 읽힌다. */
#guide{
  flex:0 0 auto;display:flex;gap:14px;padding:16px 16px;align-items:center;min-height:118px;
  background:#fff;border-bottom:var(--l) solid var(--ink);
}
#guideFace{
  flex:0 0 auto;width:64px;height:64px;border-radius:18px;
  background:var(--acc);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  position:relative;overflow:hidden;
}
#guideFace::before,#guideFace::after{
  content:"";position:absolute;top:24px;width:8px;height:11px;border-radius:4px;background:var(--ink);
}
#guideFace::before{left:17px}
#guideFace::after{right:17px}
#guideText{flex:1 1 auto;min-width:0;font-size:16px;font-weight:700;line-height:1.6;color:var(--ink)}
#guideText b{color:#a1350c}
/* 테두리 상자는 **줄이 넘어가면 조각나** 보인다(폰에서 「검정말 잎세포」가 두 줄로 잘렸다).
   색과 밑줄은 줄을 넘어도 자연스럽다. `b` 는 주황이므로 강조는 파랑으로 가른다 */
#guideText .hl,.hl{
  color:#0f5ba8;font-weight:900;
  text-decoration:underline;text-decoration-color:rgba(15,91,168,.32);
  text-decoration-thickness:3px;text-underline-offset:3px;
}

.hint .step{
  display:inline-block;margin-right:9px;padding:0 9px;line-height:22px;
  border:2px solid var(--ink);border-radius:999px;background:var(--sun);
  font-size:12.5px;font-weight:900;vertical-align:1px;
}
/* ⑤ 날개(읽는 카드)는 한 톤 낮춘다 — 무대 안내 띠와 선임 대사가 앞에 서게. */
#panel .card{font-size:13.5px}
#panel .card h3{font-size:13.5px}
#panel .card p{color:#3f3a4d}

/* 조작 패널 */
#panel{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:15px;-webkit-user-select:text;user-select:text;
}
#navbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-top:var(--l) solid var(--ink);background:var(--paper);
  padding-bottom:max(11px,env(safe-area-inset-bottom));
}
#stepno{margin:0 auto;font-size:12.5px;font-weight:900;color:var(--ink2);font-variant-numeric:tabular-nums}
#navbar button{
  padding:10px 17px;border-radius:13px;font-size:14.5px;font-weight:900;
  background:#fff;color:var(--ink);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
#navbar button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#navbar button.primary{background:var(--acc);color:var(--ink)}
#navbar button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- 패널 부품 ---------- */
.card{
  background:#fff;border:var(--l-sm) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh-sm);padding:14px;margin-bottom:13px;
}
.card>h3{font-size:14.5px;font-weight:900;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.card>h3::before{content:"";width:7px;height:16px;border-radius:3px;background:var(--acc);border:2px solid var(--ink)}
.card p{font-size:13.5px;font-weight:700;color:#3a3348;margin-bottom:8px;line-height:1.65}
.card p:last-child{margin-bottom:0}
.muted{color:var(--ink2);font-size:12.5px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dashed var(--line);font-size:13.5px;font-weight:800}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.tag{
  display:inline-block;font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:999px;
  background:var(--acc);color:var(--ink);border:2px solid var(--ink);margin-right:5px;
}
.tag.w{background:var(--sun2)}
.tag.g{background:var(--grass)}
.tag.r{background:var(--blood)}

.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:12px;font-size:13.5px;font-weight:800}
.chk.done{background:#e9f9ef;color:#1b6b39;border:2px solid var(--ink)}
.chk.done .bx{background:var(--grass);border-color:var(--ink);color:var(--ink)}
.chk .bx{
  flex:0 0 auto;width:21px;height:21px;border-radius:7px;border:2.5px solid #c9c2b1;
  display:grid;place-items:center;font-size:12px;font-weight:900;color:transparent;margin-top:1px;
}
.chk.done .bx::after{content:"✓"}

.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.btn{
  padding:9px 15px;border-radius:13px;font-size:13.5px;font-weight:900;
  background:#fff;border:var(--l-sm) solid var(--ink);color:var(--ink);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.fill{background:var(--acc)}
.btn.ghost{background:#f2ecdc}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}

.field{
  width:100%;padding:10px 12px;border:var(--l-sm) solid var(--ink);border-radius:12px;
  font:inherit;font-size:14px;font-weight:700;background:#fff;color:var(--ink);
}
.field:focus{outline:0;box-shadow:0 0 0 4px rgba(76,201,240,.4)}
textarea.field{min-height:92px;resize:vertical;line-height:1.6}

table.dat{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
table.dat th,table.dat td{border:2px solid var(--ink);padding:7px 8px;text-align:center;background:#fff;word-break:keep-all}
/* 넓은 표는 감싸개 안에서 가로로 민다. keep-all 만 두면 좁은 화면에서 표가 카드 밖으로 나간다 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll>table.dat{min-width:max-content}
table.dat th{background:var(--acc);font-weight:900;color:var(--ink)}
table.dat td.l{text-align:left}

/* 선택형 문항 */
.qz .opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 13px;border:var(--l-sm) solid var(--ink);border-radius:13px;margin-bottom:9px;
  background:#fff;font-size:13.5px;font-weight:700;line-height:1.5;
  box-shadow:var(--sh-sm);transition:transform .06s,box-shadow .06s;
}
.qz .opt:hover:not(:disabled){background:#fffdf4}
.qz .opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.qz .opt .no{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:#f2ecdc;color:var(--ink);
  border:2px solid var(--ink);font-size:12px;font-weight:900;display:grid;place-items:center;
}
.qz .opt.ok{background:#e9f9ef}
.qz .opt.ok .no{background:var(--grass)}
.qz .opt.no2{background:#ffefef}
.qz .opt.no2 .no{background:var(--blood)}
.qz .opt:disabled{cursor:default;box-shadow:var(--sh-sm);transform:none}
.why{
  margin-top:7px;padding:11px 13px;border-radius:13px;background:#fffdf4;
  border:2.5px solid var(--ink);border-left-width:8px;
  font-size:13px;font-weight:700;color:#3a3348;line-height:1.65;
}
.why.bad{background:#ffefef;border-left-color:var(--blood)}

/* ---------- 무대 안 공용 부품 ---------- */
.stagewrap{position:absolute;inset:0}
/* 아래 안내 띠(.hint)가 앉는 자리는 캔버스에서 처음부터 뺀다.
   장면마다 「아래쪽에 그리면 띠에 가린다」를 조심하는 대신 자리를 아예 비워 둔다. */
/* 무대는 세로 두 칸이다 — 위 #play(그림), 아래 #ctrl(조작판).
   **높이를 JS 로 재서 넣지 않는다.** 그렇게 했더니 한 프레임 동안 캔버스가 컸다가 줄어들어,
   그 사이에 크기를 잰 검사들이 엉뚱한 자리를 눌렀다. 배치는 브라우저가 한 번에 잡게 둔다. */
#play{flex:1 1 auto;position:relative;min-height:0}
#stage canvas{position:absolute;left:0;top:0;
  width:100%;height:calc(100% - var(--hintzone));
  touch-action:none;display:block}

/* ===== 무대 안 조작판 =====
   루키랩의 판처럼 무대 아래쪽에 겹쳐 뜬다. 손이 무대를 안 떠난다.
   내용이 길면 이 안에서만 굴러가고, 무대 그림은 그만큼 위로 줄어든다. */
#ctrl{
  /* **높이를 내용에 맡기면 안 된다.** 단추를 누를 때마다 판이 커졌다 작아지고,
     그때마다 위 그림이 같이 줄었다 늘었다 해서 눈이 어지럽다.
     실제로 「표본 다시 만들기」를 누르면 판이 바뀌며 그림이 튀었다.
     그래서 **자리를 고정으로 잡아 두고** 내용이 넘치면 이 안에서만 굴러가게 한다. */
  /* 높이는 엔진이 **장면마다 한 번** 정한다(sizeCtrlOnce). 여기는 기본값과 상한.
     한 장면 안에서는 안 바뀐다 — 바뀌면 위 그림이 튄다. */
  flex:0 0 40%;max-height:40%;position:relative;z-index:3;
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:10px 12px 12px;
  /* 무대 바닥 위에 카드가 떠 있는 것처럼 — 루키랩의 판과 같은 느낌.
     바탕을 살짝만 어둡게 하고 카드에 테두리와 그림자를 준다. */
  background:rgba(24,19,34,.06);
  border-top:var(--l) solid var(--ink);
}
#ctrl:empty{display:none}
/* 무대가 넓어도 카드는 좁은 기둥으로. 890px 짜리 단추 줄은 손이 헤맨다. */
#ctrl>.card{margin:0 auto 10px;max-width:560px;width:100%;
  background:var(--paper);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);border-radius:14px}
#ctrl>.card:last-child{margin-bottom:0}
/* ② 「아직」 — 지금 단계에서 못 쓰는 조작은 접어 둔다.
   접안렌즈를 끼우는 단계에 초점 막대가 제일 크게 떠 있으면 학생이 그걸 만진다.
   엔진이 「든 조작이 전부 disabled 인 카드」에 later 를 붙인다. */
#ctrl>.card.later{opacity:.55;padding-bottom:8px}
#ctrl>.card.later>*:not(h3){display:none}
#ctrl>.card.later>h3{margin:0}
#ctrl>.card.later>h3::after{
  content:"아직";margin-left:8px;font-size:11px;font-weight:900;color:var(--ink);
  background:#e5e0d3;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;vertical-align:middle;
}
/* 체크리스트는 조작판 맨 위에 온다 — 길잡이다 */
#ctrl>.card.steps{background:#fff}
/* 체크 줄을 세로로 쌓으면 조작판이 무대의 40% 를 먹어 그림이 작아진다(사용자: 「상하 스크롤을
   최소화」). 무대 안 조작판에서는 체크 줄을 **가로로 흘려** 두 줄 안에 끝낸다. 단추 줄과 값 줄은 한 줄 통째 */
/* (2026-09-08) 제목, 체크 줄, 단추 줄까지 **전부 한 흐름**으로 흘린다. 세로가 곧 그림 크기다
   (사용자: 「실험 대상이 크게 보여야 집중이 잘 된다」). 값 줄(.kv)과 경고 칸만 한 줄 통째 */
#ctrl>.card.steps{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;padding:8px 12px 9px}
#ctrl>.card.steps>h3{flex:0 0 auto;margin:0 4px 0 0}
#ctrl>.card.steps>.chk{flex:0 1 auto;padding:4px 9px;font-size:12.5px;border:2px solid transparent;align-items:center}
#ctrl>.card.steps>.chk .bx{margin-top:0;width:18px;height:18px}
#ctrl>.card.steps>.chk.done{border-color:var(--ink)}
#ctrl>.card.steps>.btnrow{flex:0 1 auto;margin-top:0;gap:6px}
#ctrl>.card.steps>.btnrow .btn{padding:7px 12px;font-size:13px}
#ctrl>.card.steps>*:not(.chk):not(h3):not(.btnrow){flex:0 0 100%}
#ctrl>.card.steps>div:empty{display:none}
#ctrl{flex:0 0 34%;max-height:34%}

/* ===== 확인 화면 (2026-09-07) =====
   확인 문항은 조작판 아래에 매달려 있어서 굴려 내려가야 보였다. 손일이 끝나면 무대 위로
   이 화면이 올라온다. 문항이 한가운데 크게, 발치에 「다음 단계로」 하나. */
#qzv{
  position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eef6fc 0%,#e2eef8 100%);
}
#qzv[hidden]{display:none}
#qzv.in{animation:qzin .24s cubic-bezier(.2,1.2,.4,1)}
@keyframes qzin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#qzv.kick{animation:pkick .28s cubic-bezier(.2,1.6,.4,1)}
.qzhead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:#fff;border-bottom:var(--l) solid var(--ink);
}
.qzhead .qzk{
  font-size:11.5px;font-weight:900;padding:3px 10px;border-radius:999px;
  background:var(--sun);border:2px solid var(--ink);white-space:nowrap;
}
.qzhead b{flex:1 1 auto;min-width:0;font-size:16px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qzhead .qznum{
  flex:0 0 auto;font-size:12.5px;font-weight:900;color:var(--ink);
  padding:3px 9px;border-radius:999px;background:#e9eef4;border:2px solid var(--ink);
}
.qzhead .qznum:empty{display:none}
.qzhead .qzback{
  flex:0 0 auto;padding:7px 12px;border-radius:11px;font-size:12.5px;font-weight:900;
  background:#f2ecdc;border:var(--l-sm) solid var(--ink);color:var(--ink);box-shadow:var(--sh-sm);
}
.qzhead .qzback:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
/* 확인 화면의 몸통 — 좁은 화면은 세로(그림 위, 문항 아래), 넓은 화면은 가로(그림 왼쪽) */
.qzbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* 무대 그림은 늘 가로로 길다. 옆 기둥보다 **위 띠**로 두어야 크게 나온다.
   높이는 확인 화면 높이의 비로 잡는다(vh 로 잡으면 폰에서 무대가 화면의 절반뿐이라 어긋난다) */
/* 높이는 qzShotDraw 가 확인 화면 높이를 재서 직접 넣는다.
   flex-basis 를 퍼센트로 주면 세로 flex 안에서 0 으로 잡히는 브라우저가 있다 */
.qzshot{
  flex:0 0 auto;height:140px;
  position:relative;display:flex;align-items:center;justify-content:center;padding:10px;
  background:#dfeaf6;border-bottom:var(--l) solid var(--ink);cursor:zoom-in;
}
.qzshot.big{cursor:zoom-out}
.qzshot[hidden]{display:none}
/* 문항이 길면 그림은 이름표만 남기고 접힌다. 눌러서 다시 편다 */
.qzshot.thin{height:34px;padding:0 12px;min-height:0;justify-content:flex-start;cursor:zoom-in}
#qzv .qzshot.thin canvas{display:none}
.qzshot.thin .qzshotk{position:static;left:auto;top:auto;max-width:100%}
/* #stage canvas 의 절대배치 규칙을 벗긴다 (#qzv 가 #stage 안에 있다).
   `#stage canvas` 는 아이디가 있어 클래스 선택자보다 세다. 여기도 아이디를 붙여야 이긴다 */
#qzv .qzshot canvas{position:static;display:block;flex:0 0 auto;touch-action:auto;
  border:2.5px solid var(--ink);border-radius:12px;background:#eef6fc}
.qzshotk{
  position:absolute;left:12px;top:8px;font-size:11px;font-weight:900;color:var(--ink);
  padding:3px 9px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);
  pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.qzlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px}
.qzlist>.card{max-width:660px;margin:0 auto 12px;background:#fff;border-radius:16px;padding:16px 18px}
.qzlist>.card:last-child{margin-bottom:0}
.qzlist>.card[hidden]{display:none}
/* 머리띠가 이미 「확인 문항」이라고 적는다. 안에서 또 적으면 25 px 를 그냥 먹는다 */
.qzlist>.card.qz>h3{display:none}
/* 한 문항씩 넘기기 — 단추는 아래 띠에 바로 놓는다 */
.qzpg[hidden]{display:none}
.qzpgb{
  flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:12px;
  font-size:13.5px;font-weight:900;color:var(--ink);
  background:#fff;border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
.qzpgb:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.qzpgb:disabled{opacity:.35;box-shadow:none}
.qzpgb.next{margin-left:auto;background:var(--sun)}
.qzpgb[hidden],.qzgo[hidden]{display:none}
.qzpgb.next.go{animation:go 1.1s ease-in-out infinite}
.qzpgn{flex:0 0 auto;font-size:13px;font-weight:900;color:var(--ink2)}
.qzpgn[hidden]{display:none}
.qzlist .card>h3{font-size:15.5px}
.qzlist .card p{font-size:15px;line-height:1.7}
.qzlist .qz .opt{font-size:14.5px;padding:13px 14px;line-height:1.55}
.qzlist .why{font-size:14px}
.qzlist .kv{font-size:14.5px}
.qzlist .field{font-size:15px}
.qzlist .chk{font-size:14px}
.qzfoot{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--paper);border-top:var(--l) solid var(--ink);
}
/* 잠근 말은 머리띠 아래 한 줄로. 아래 띠에 두면 두 줄이 되어 50 px 를 먹는다 */
.qzmsgline{
  flex:0 0 auto;padding:5px 14px;font-size:12.5px;font-weight:800;color:var(--ink2);
  background:#e9eef4;border-bottom:2px solid rgba(24,19,34,.18);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.qzmsgline[hidden]{display:none}
/* 넓은 화면은 아래 띠에 잠근 말이 그대로 들어간다. 위아래로 두 번 적지 않는다 */
@media (min-width:621px){ .qzmsgline{display:none} }
.qzmsg{flex:1 1 auto;min-width:0;font-size:13px;font-weight:800;color:var(--ink2);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){ .qzmsg{display:none} }   /* 폰에서는 위 얇은 줄이 대신한다 */
.qzgo{
  flex:0 0 auto;margin-left:auto;min-height:44px;padding:0 20px;border-radius:14px;font-size:15.5px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--acc);color:var(--ink);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
.qzgo:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.qzgo:disabled{opacity:.4;box-shadow:none}
.qzgo.go{animation:go 1.1s ease-in-out infinite}
/* 조작판의 길잡이 카드 — 「확인 문항 풀기 →」. 풀 차례면 노랗게 맨 위에 */
#ctrl>.card.qzcard{padding:10px 12px;text-align:center}
#ctrl>.card.qzcard .btn{width:100%;font-size:15px;padding:12px 14px}
#ctrl>.card.qzcard.pend{background:var(--sun);animation:pulse 1.1s infinite}
#ctrl>.card.qzcard[hidden]{display:none}
/* 문항 옆의 작은 그림(결과 종이) — #stage canvas 의 절대배치 규칙을 벗긴다 */
#qzv canvas.thumb{position:static;display:block;flex:0 0 auto;touch-action:auto;
  border:2.5px solid var(--ink);border-radius:12px;background:#eef6fc}
.thumbrow{display:flex;gap:14px;align-items:flex-start}
.thumbrow .qcol{flex:1 1 auto;min-width:0}
.thumbrow .qcol select{margin-bottom:10px}
@media (max-width:620px){
  .thumbrow{flex-direction:column;align-items:center}
}
/* 다음 단추가 「확인 문항 →」 노릇을 할 때 */
#navbar #btnNext.qzpend{background:var(--sun)}
@media (max-width:620px){
  .qzhead b{font-size:14px}
  .qzlist{padding:12px 10px}
  .qzlist>.card{padding:11px 12px}
  .qzlist .card p{font-size:14px;line-height:1.6}
  .qzlist .qz .opt{font-size:13.5px;padding:9px 11px;line-height:1.5}
  .qzgo{padding:11px 16px;font-size:14.5px}
}
.hint{
  /* #play 안에 있으므로 조작판 위에 저절로 앉는다. */
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  background:var(--paper);color:var(--ink);border:var(--l-sm) solid var(--ink);
  box-shadow:var(--sh-sm);
  /* ⑤ 한 화면에서 제일 큰 말이어야 한다. 선임 대사, 조작판 설명, 날개 카드가 같은 말을
     네 번 하는데, 학생이 봐야 할 것은 「지금 할 것 하나」다. 그래서 이것만 키운다. */
  padding:9px 18px;border-radius:999px;font-size:15.5px;font-weight:900;
  pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
.stagetag{
  position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none;z-index:2;
}
.stagetag span{
  background:#fff;border:2.5px solid var(--ink);color:var(--ink);box-shadow:var(--sh-sm);
  font-size:11.5px;font-weight:900;padding:3px 10px;border-radius:999px;
}
.stagetag span.on{background:var(--acc)}

/* 도구 선반 */
.shelf{
  position:absolute;left:0;right:0;bottom:0;display:flex;gap:9px;align-items:flex-end;
  padding:10px 12px 12px;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(180deg,rgba(10,18,32,0),rgba(8,14,26,.92) 38%);
}
.shelf::-webkit-scrollbar{display:none}
.tool{
  flex:0 0 auto;width:78px;padding:8px 4px 6px;border-radius:14px;text-align:center;
  background:var(--paper);border:var(--l-sm) solid var(--ink);color:var(--ink);cursor:grab;
  box-shadow:var(--sh-sm);transition:transform .07s,box-shadow .07s;position:relative;
}
.tool:hover{background:#fff}
.tool.pick{background:var(--sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool.need{animation:pulse 1.1s infinite}
.tool.used{opacity:.4;pointer-events:none;box-shadow:none}
.tool svg{width:44px;height:44px;display:block;margin:0 auto 3px}
.tool span{font-size:11px;font-weight:900;display:block;line-height:1.25}
@keyframes pulse{
  0%,100%{box-shadow:var(--sh-sm)}
  50%{box-shadow:var(--sh-sm),0 0 0 7px rgba(255,210,63,.45)}
}

/* ---------- 모달 ---------- */
#veil{position:fixed;inset:0;background:rgba(24,19,34,.72);display:grid;place-items:center;z-index:60;padding:18px}
#veil[hidden]{display:none}
#sheet{
  width:min(640px,100%);max-height:86vh;overflow-y:auto;background:var(--paper);
  border:var(--l) solid var(--ink);border-radius:20px;
  padding:22px;box-shadow:8px 8px 0 var(--ink);-webkit-user-select:text;user-select:text;
  animation:pop .22s cubic-bezier(.3,1.5,.5,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#sheet h2{font-size:22px;font-weight:900;margin-bottom:5px;letter-spacing:-.01em}
#sheet .sub{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:15px}
#sheet section{margin-bottom:16px}
#sheet section h4{font-size:14.5px;font-weight:900;margin-bottom:7px;color:var(--ink);
  display:flex;align-items:center;gap:7px}
#sheet section h4::before{content:"";width:7px;height:15px;border-radius:3px;background:var(--acc);border:2px solid var(--ink)}
#sheet p,#sheet li{font-size:13.5px;font-weight:700;color:#3a3348;line-height:1.7}
#sheet li{margin-bottom:4px}
#sheet .close{
  display:block;width:100%;margin-top:8px;padding:13px;border-radius:15px;
  background:var(--acc);color:var(--ink);font-weight:900;font-size:16px;
  border:var(--l) solid var(--ink);box-shadow:var(--sh);
  transition:transform .06s,box-shadow .06s;
}
#sheet .close:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
/* 시리즈 각주 — 이 도구가 루키랩의 다음 것이라는 표시 */
#sheet .serieshint{
  margin-top:14px;padding:11px 13px;border-radius:13px;
  background:#fff;border:2.5px solid var(--ink);
  font-size:12.5px;font-weight:800;color:#3a3348;line-height:1.6;
}
#sheet .serieshint b{color:#a1350c}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);
  background:#fff;color:var(--ink);border:var(--l-sm) solid var(--ink);box-shadow:var(--sh);
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:900;
  opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--blood);color:#fff}
#toast.good{background:var(--grass)}

/* 노트 */
.note{border:2.5px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:11px;background:#fff}
.note h5{font-size:13.5px;font-weight:900;margin-bottom:5px}
.note pre{white-space:pre-wrap;font:inherit;font-size:13px;font-weight:700;color:#3a3348;margin:0}

/* ---------- 모바일 ---------- */
/* ===== 화면 모양에 따른 배치 =====
   폭 900px 하나로 갈랐더니 **세로로 든 태블릿**(768×1024 은 폰 배치, 1024×1366 은 PC 배치)이
   엉뚱한 데 걸렸다. 폭이 아니라 모양으로 가른다.
     세로로 긴 화면(폰, 세로 태블릿)  → 한 기둥: 무대 위, 날개 아래
     가로로 긴 화면(PC, 가로 태블릿)  → 무대 | 날개
   글자 크기를 줄이는 것은 진짜 폰(620px 아래)에서만 한다. 10인치 태블릿은 PC 글자가 맞다. */
@media (max-width:900px), (orientation:portrait){
  #main{flex-direction:column}
  /* 여기(태블릿, 가로 좁은 화면)는 #app 이 fixed 라 vh 가 흔들리지 않는다. 그대로 둔다.
     흔들리는 것은 **페이지가 스크롤되는 폰 세로**뿐이고, 그쪽은 아래에서 svh 로 고쳤다.
     퍼센트로 바꿔 봤더니 무대가 70 px 작아져 분획 편의 다이얼 좌표가 어긋났다 */
  #stage{flex:0 0 auto;height:64vh;min-height:320px;border-right:0;border-bottom:var(--l) solid var(--ink)}
  #side{flex:1 1 auto}
  #ctrl{flex:0 0 42%;max-height:42%}
  /* 세로 태블릿처럼 넓은데 한 기둥이면 글줄이 너무 길다. 속을 가운데로 모은다. */
  #panel>.card{max-width:840px;margin-left:auto;margin-right:auto}
  #guide{justify-content:center}
  #guideText{flex:0 1 760px}
  #ctrl>.card{max-width:640px}
  /* 폰에서 이전/다음이 날개 맨 아래로 밀려 화면 밖으로 나갔다(사용자: 「어떤 버튼을 눌러야 넘어가는지 모르겠어」).
     한 기둥일 때는 이전/다음을 **무대 바로 아래, 선임 대사 위**에 둔다. 읽는 카드는 그 아래에서 스크롤. */
  #navbar{order:-1;border-top:0;border-bottom:var(--l) solid var(--ink);padding:8px 12px;padding-bottom:8px}
  #navbar button{padding:8px 15px;font-size:14px}
}
/* 가로 태블릿(1024×768 쯤): 날개를 조금 좁혀 무대에 더 준다 */
@media (min-width:901px) and (max-width:1200px) and (orientation:landscape){
  #side{flex:0 0 clamp(300px, 34vw, 386px)}
}
/* 손가락으로 누르는 기기: 단추를 44px 아래로 안 내린다 */
@media (pointer:coarse){
  #ctrl button,#panel button,#navbar button{min-height:44px}
  input[type=range]{min-height:30px}
}
/* 폰 — 크기만 줄인다 */
@media (max-width:700px){
  #menu .ml{display:none}
  #score{font-size:11.5px;padding:1px 8px;margin-left:4px}
  /* 단추가 다섯(i ? ✎ ♪ ⛶)이 되자 폰에서 점수가 「41」로 잘리고 제목이 사라졌다.
     배지는 숨기고(제목 옆 「루키랩 시리즈」), 제목이 먼저 줄어들게 한다. */
  #badge{display:none}
  #ttl{flex:1 1 auto;min-width:40px}
  #ctrl{padding:8px 10px 10px}
  #ctrl>.card{max-width:none}
}
@media (max-width:620px){
  body{font-size:14.5px}
  :root{--bar:54px;--rail:44px}
  #ttl{font-size:15px}
  #badge{font-size:10.5px;padding:2px 9px}
  #menu button{padding:8px 10px}
  #guide{gap:12px;padding:13px 14px;min-height:96px}
  #guideFace{width:52px;height:52px;border-radius:15px}
  #guideFace::before,#guideFace::after{top:19px;width:7px;height:9px}
  #guideFace::before{left:14px}
  #guideFace::after{right:14px}
  #guideText{font-size:15px}
  /* 좁은 화면에서는 한 줄에 안 들어가 「…」로 잘렸다. 두 줄로 접는다.
     절대배치라 내용만큼만 줄어들어 188px 로 세 줄이 됐던 적이 있어 폭을 채운다. */
  .hint{font-size:13.5px;padding:7px 12px;white-space:normal;line-height:1.3;text-align:center;
        width:calc(100% - 24px);max-width:none;box-sizing:border-box}
  .hint .step{font-size:11.5px;line-height:20px;margin-right:7px}
  .tool{width:68px}
  .tool svg{width:38px;height:38px}
}
/* 예전에는 「좁고 가로로 긴 화면」에서 다시 두 칸으로 되돌렸다(무대 왼쪽, 조작판 오른쪽 310px).
   **한 기둥으로 가기로 한 지금은 이 규칙이 정면으로 어긋난다.** 눈과 손을 다시 갈라 놓는다.
   실제로 검사 하네스의 iframe 이 864x805(가로)라 여기에 걸려, 앱은 멀쩡한데 캔버스가
   145px 로 쪼그라들어 두 편이 떨어졌다. 걷어냈다.
   가로로 누운 폰에서는 기둥 폭이 화면 높이를 따라 좁아지므로 그대로 한 기둥이면 된다. */
@media (max-width:900px) and (orientation:landscape){
  /* 가로로 누우면 세로가 짧다. 무대를 조금 낮춰 날개의 읽을 거리도 보이게 한다. */
  #stage{height:66svh;min-height:200px}
}
/* 진짜 폰(세로).
   한때 여기서만 **페이지를 통째로 스크롤**하게 했다(무대 62svh, 카드는 아래로 내려 읽기).
   그런데 사용자가 다시 짚었다 — 「스크롤을 내렸다 돌렸다 하는 게 불편하다.」
   장면 9 처럼 **손잡이는 아래에, 그 결과(그래프)는 위에** 있으면 둘을 같이 볼 수가 없다.

   그래서 **페이지 스크롤을 없앴다.** 무대, 조작판, 이전/다음은 늘 제자리에 붙어 있고
   스크롤은 선임 대사와 읽는 카드 **안에서만** 일어난다.
   (옛 걱정이던 「어떤 단추를 눌러야 넘어가는지 모르겠다」는 `#navbar{order:-1}` 로 이미 풀렸다 —
    이전/다음이 무대 바로 아래에 있다.) */
@media (max-width:620px) and (orientation:portrait){
  #stage{flex:0 0 66%;height:auto;min-height:0}
  #ctrl{flex:0 0 38%;max-height:38%;display:flex;flex-direction:column;align-items:stretch}
  /* 문항을 풀 때는 **화면 전체**를 쓴다. 무대 칸 안에 가두면 조작판만큼 좁아져 굴려야 한다.
     이때 조작판도 대사도 볼 일이 없다 */
  #qzv{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar) + var(--rail));z-index:20}
  /* 좁은 조작판에서는 **손으로 만지는 카드가 먼저**다.
     체크리스트는 「무엇을 했는지」일 뿐이라 굴려서 봐도 된다.
     (사용자: 장면 9 에서 슬라이더가 아래에 있어 그래프와 같이 볼 수가 없었다) */
  #ctrl>.card{flex:0 0 auto;order:1}
  #ctrl>.card.qzcard.pend{order:0}
  #ctrl>.card.steps{order:2}
  #ctrl>.card.later{order:3}
  #ctrl>.card.qzcard{order:4}
  /* 체크리스트에 붙은 설명은 한 번 읽으면 그만이다. 좁은 화면에서는 접는다 */
  #ctrl>.card.steps>p{font-size:12px;line-height:1.5;max-height:3em;overflow:hidden}
  #side{min-height:0}
  /* 선임 대사는 세 줄까지만 자리를 차지하고 그 안에서 굴린다. 늘 붙어 있어야 할 것은 아니다 */
  #guide{flex:0 0 auto;max-height:94px;overflow-y:auto}
  #panel{flex:1 1 auto;min-height:0;overflow-y:auto}
  #navbar{flex:0 0 auto}
}
/* 아주 짧은 폰(640 아래): 대사를 더 줄이고 무대를 지킨다 */
@media (max-width:620px) and (orientation:portrait) and (max-height:700px){
  #stage{flex:0 0 68%}
  #guide{max-height:74px}
}
@media (prefers-reduced-motion:reduce){
  #sheet,.tool.need{animation:none}
}

/* ===== 손맛 층 (2026-09-07) ===== */
/* 찰칵 붙는 순간 무대가 한 번 「툭」 */
#play.kick{animation:pkick .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pkick{0%{transform:scale(1)}35%{transform:scale(1.022)}100%{transform:scale(1)}}
/* 헛짚으면 흔들린다 (루키랩 #stage.shake) */
#play.shake{animation:pshake .32s}
@keyframes pshake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
/* 무대 안 말풍선 — 사수가 직접 말한다 */
#say{
  position:absolute;right:10px;top:10px;z-index:3;display:flex;align-items:flex-start;gap:8px;
  max-width:min(74%,420px);pointer-events:none;
  opacity:0;transform:translateY(-8px) scale(.94);transition:opacity .16s,transform .18s cubic-bezier(.3,1.5,.5,1);
}
#say.in{opacity:1;transform:none}
/* 붙는 귀 — sayCorner 가 무대에서 가장 빈 귀를 골라 data-at 으로 적어 준다 */
#say[data-at="tr"]{right:10px;left:auto;top:10px;bottom:auto}
#say[data-at="tl"]{left:10px;right:auto;top:10px;bottom:auto}
#say[data-at="br"]{right:10px;left:auto;bottom:10px;top:auto}
#say[data-at="bl"]{left:10px;right:auto;bottom:10px;top:auto}
/* 왼쪽에 붙으면 얼굴도 왼쪽으로 옮기고 꼬리를 반대로 — 얼굴이 무대 쪽을 안 가린다 */
#say[data-at="tl"] .f,#say[data-at="bl"] .f{order:1}
#say[data-at="tl"] .b,#say[data-at="bl"] .b{order:2}
#say[data-at="tl"] .b::after,#say[data-at="bl"] .b::after{
  right:auto;left:-13px;border-left-color:transparent;border-right-color:#181322}
#say .f{
  flex:0 0 auto;width:46px;height:46px;order:2;
  border:3px solid #181322;border-radius:12px;overflow:hidden;background:#4cc9f0;box-shadow:3px 3px 0 #181322;
}
#say .f:empty{display:none}
#say .f svg{width:100%;height:100%;display:block}
#say .b{
  position:relative;order:1;background:#fff;border:3px solid #181322;border-radius:14px;padding:6px 11px 7px;
  box-shadow:3px 3px 0 #181322;font-size:14px;font-weight:800;line-height:1.4;color:#181322;word-break:keep-all;
}
#say .b b{display:block;font-size:11px;color:#6b7280;margin-bottom:1px}
#say .b span b{display:inline;font-size:inherit;color:#c2410c}
#say .b::after{content:"";position:absolute;right:-13px;top:14px;border:6px solid transparent;border-left-color:#181322}
#say.bad .b{background:#fff1f1}
#say.bad .f{background:#ff5c5c}
@media (max-width:620px){
  #say{max-width:82%;top:8px;right:8px}
  #say[data-at="tr"]{right:8px;top:8px}
  #say[data-at="tl"]{left:8px;top:8px}
  #say[data-at="br"]{right:8px;bottom:8px}
  #say[data-at="bl"]{left:8px;bottom:8px}
  #say .b{font-size:13px;padding:5px 9px 6px}
  #say .f{width:40px;height:40px}
}

/* 2026-09-27: 터치 도구의 우선순위와 보조 메뉴 */

#moreMenu:not([open]) .menuItems{display:none}

#panel .card{border:1px solid #d5d3cc;box-shadow:none;background:#fffdf7}

#ctrl>.card{border-width:2px;box-shadow:0 2px 0 #18132218}

button:focus-visible,summary:focus-visible,.tool:focus-visible{outline:3px solid #087caf;outline-offset:3px}
button,summary{touch-action:manipulation}
@media(max-width:700px){
  #bar{gap:6px;padding-left:8px;padding-right:8px}

/* ---------------- 선생님 시범 (2026-10-15) ----------------
   시범 중에는 아래 안내 띠 자리를 시범 띠가 덮는다(캔버스 밖이라 그림을 안 가린다).
   조작판은 흐리게 잠그고, 무대 위 투명 덮개가 학생의 손을 받아 2배속으로 바꾼다. */

  position:absolute;left:8px;right:8px;bottom:6px;z-index:8;min-height:40px;

  background:#9b6dff;color:#fff;border:var(--l-sm) solid var(--ink);border-radius:14px;box-shadow:var(--sh-sm);
  font-size:14px;font-weight:800;pointer-events:none;
}
#demoBar .f{flex:0 0 auto;width:32px;height:32px;border:2.5px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
#demoBar .f svg{width:100%;height:100%;display:block}
#demoBar .t{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#demoBar .tr i{display:block;height:100%;width:0;background:#ffd23f;transition:width .3s}
#demoBar .sp{flex:0 0 auto;font-size:11.5px;opacity:.92;white-space:nowrap}

#guideBtns{flex:0 0 auto;align-self:center}

#guidePop button{min-height:44px;padding:4px 14px;border-radius:10px;font-size:13px;font-weight:900;color:var(--ink);
  background:#fff;border:2.5px solid var(--ink);text-align:left;white-space:nowrap}
#guidePop button[data-for=demoBtn]{background:#efe7ff}
#guidePop button[data-for=photoBtn]{background:#fff3b0}
#app.demo #guideMore{visibility:hidden}
#demoBtn{
  min-height:44px;padding:4px 9px;border-radius:10px;white-space:nowrap;
  font-size:11.5px;font-weight:900;color:var(--ink);background:#efe7ff;
  border:2.5px solid var(--ink);box-shadow:var(--sh-sm);
}
#demoBtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
@media(max-width:520px){
  #demoBar{font-size:12.5px;gap:6px}
  #demoBar .sp{display:none}
  #demoHand{width:46px;height:61px}
  #demoHand svg{width:46px;height:61px}
}
@media(prefers-reduced-motion:reduce){
  #demoHand{transition:none}
}

/* ---------------- 실제 실험 사진 카드 (2026-10-15) ----------------
   무대와 조작판(#stage)을 통째로 덮는다. 폰에서 무대만 덮으면 사진이 너무 작다.
   사진은 비율을 지키며 남는 높이를 다 쓴다(object-fit:contain). */
#photoCard{
  position:absolute;inset:8px;z-index:30;display:flex;flex-direction:column;gap:6px;
  background:#fffdf7;border:var(--l-sm) solid var(--ink);border-radius:16px;box-shadow:var(--sh);
  padding:10px 12px 12px;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .18s,transform .22s cubic-bezier(.3,1.4,.5,1);
}
#photoCard.in{opacity:1;transform:none}
#photoCard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
#photoCard .ph b{font-size:15px;font-weight:900;color:var(--ink);background:#fff3b0;border:2px solid var(--ink);border-radius:999px;padding:3px 12px}
#photoCard .ph span{font-size:12px;font-weight:800;color:#6b7280}
#photoCard .pf{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#f3f1ea;border-radius:10px;overflow:hidden}
#photoCard .pf img,#photoCard .pf video{max-width:100%;max-height:100%;object-fit:contain;display:block}
#photoCard .pc{flex:0 0 auto;font-size:14.5px;font-weight:800;line-height:1.45;color:var(--ink);word-break:keep-all}
#photoCard .pr{flex:0 0 auto;font-size:11px;color:#6b7280;word-break:keep-all}
#photoCard .pn{flex:0 0 auto;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#photoCard .pn .btn{min-height:44px}
#photoBtn{
  min-height:44px;padding:4px 9px;border-radius:10px;white-space:nowrap;
  font-size:11.5px;font-weight:900;color:var(--ink);background:#fff3b0;
  border:2.5px solid var(--ink);box-shadow:var(--sh-sm);
}
#photoBtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#app.demo #photoBtn{visibility:hidden}
/* 7장면 실제 영상 창 — 가상 시계에 맞춰 흐른다 */
#realVid{position:absolute;z-index:4;pointer-events:none;background:#fff;border:2.5px solid var(--ink);border-radius:10px;
  box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column}
#realVid video{display:block;width:100%;flex:1 1 auto;min-height:0;object-fit:cover;background:#ddd}
#realVid i{display:block;font-style:normal;font-size:10.5px;font-weight:900;text-align:center;padding:2px 2px 3px;color:var(--ink);background:#fff3b0;
  border-top:2px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:reduce){ #photoCard{transition:none} }

/* 예측 카드(2026-10-16) — 사진 카드 틀에 고르기 단추 */
#photoCard.pred .pq{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#photoCard.pred .pnote{font-size:13px;color:#6b4a00;background:#fff8d6;border:2px dashed #e0b84a;border-radius:10px;padding:6px 10px;margin:0;word-break:keep-all}
#photoCard.pred .pqq p{margin:0 0 6px;font-size:15px;font-weight:900;color:var(--ink);word-break:keep-all}
#photoCard.pred .pqo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#photoCard.pred .popt{min-height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;
  background:#fff;border:2.5px solid var(--ink);box-shadow:0 2px 0 #18132230;font-size:14px;font-weight:800;color:var(--ink);text-align:left;word-break:keep-all}
#photoCard.pred .popt.on{background:#ffd23f;transform:translate(1px,1px)}
#photoCard.pred .popt .pf2{flex:0 0 auto;width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;display:block}
#photoCard.pred .popt .pf2 svg{width:100%;height:100%;display:block}
#photoCard.pred .phtml{font-size:14.5px;line-height:1.55;color:var(--ink);word-break:keep-all}
#photoCard.pred .phtml table{width:100%;border-collapse:collapse;margin-top:4px}
#photoCard.pred .phtml td,#photoCard.pred .phtml th{border:2px solid var(--ink);padding:6px 8px;text-align:left;font-size:14px}
#photoCard.pred .phtml th{background:#f3f1ea}
#photoCard.pred .pn .btn:disabled{opacity:.45}
/* 폰 점수 — 아래 띠 장면 번호 옆. 넓은 화면은 머리띠에 있으니 숨긴다 */
#stepno .sp{display:none;font-weight:900;color:#127a5a}
#stepno .sp.bump{animation:pbump .4s}
@keyframes pbump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#stepno .sp{display:none}
@media(max-width:700px){ #stepno .sp{display:inline-block} }
#photoCard.pred .pclaim{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13.5px;word-break:keep-all}
#photoCard.pred .pclaim .pf2{flex:0 0 auto;width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;display:block}
#photoCard.pred .pclaim .pf2 svg{width:100%;height:100%;display:block}
/* 일부러 실수해 보기 — 실수 고르기 단추 2×2 */
.oopsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 8px}
.oopsgrid .btn{min-height:44px;justify-content:flex-start;text-align:left;font-size:13px;word-break:keep-all;padding-left:10px;padding-right:8px;letter-spacing:-.02em}
/* 과학사 카드 인쇄(색소 편 엥겔만, 2026-10-16) — 인쇄할 때는 카드 한 장만 */
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  body > *:not(#printSheet){display:none !important}
  #printSheet{display:block !important}
  #printSheet img{width:100%;height:auto;display:block}
}
/* ---------------- 학번 이름 확인 입장과 보내기 상태(색소 편, 2026-10-17) ---------------- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 30% 20%,#fff3c4,#ffe08a 60%,#f7c948);overflow:auto}
#gate *,#whoPop *{box-sizing:border-box}
#gate .gcard{width:100%;max-width:420px;background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 var(--ink);padding:20px 18px 16px}
#gate .gbadge{display:inline-block;font-size:12px;font-weight:900;background:var(--acc);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
#gate h2{margin:10px 0 4px;font-size:22px;font-weight:900;word-break:keep-all}
#gate .glead{margin:0 0 12px;font-weight:700;color:var(--ink2,#3a3348)}
#gate .gf{display:flex;align-items:center;gap:10px;margin:8px 0}
#gate .gf span{width:42px;font-weight:900;flex:none}
#gate .gf input{flex:1;min-width:0;min-height:46px;font-size:18px;font-weight:800;padding:6px 12px;border:var(--l-sm) solid var(--ink);border-radius:12px;background:#fff}
#gate #gGo{width:100%;min-height:50px;font-size:18px;margin-top:8px}
#gate .gmsg{min-height:22px;margin:10px 0 4px;font-weight:800;font-size:14px;word-break:keep-all}
#gate .gmsg.bad{color:#c0262d}
#gate .gnote{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:#4a4458;line-height:1.55;word-break:keep-all}
#who{margin-left:8px;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;min-height:30px;
  background:#d7f5c8;color:var(--ink);cursor:pointer;white-space:nowrap}
#who.wait,#who.busy{background:#fff1b8}#who.off{background:#ffd6d6}
#stepno .sv{display:none;margin-left:6px;min-width:28px;min-height:28px;padding:0 6px;border:2px solid var(--ink);border-radius:999px;
  font-size:12px;font-weight:900;background:#d7f5c8;color:var(--ink);cursor:pointer}
#stepno .sv.wait,#stepno .sv.busy{background:#fff1b8}#stepno .sv.off{background:#ffd6d6}
@media (max-width:700px){ #who{display:none} #stepno .sv{display:inline-block} }
#whoPop{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(24,19,34,.35);padding:16px}
#whoPop .wcard{width:100%;max-width:380px;background:var(--paper);border:var(--l-sm) solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:16px}
#whoPop h3{margin:0 0 6px;font-size:18px}
#whoPop .btnrow{flex-wrap:wrap}


/* ===== 스토리 레이어 스타일 — 루키랩 시리즈 =====
   루키랩의 아래 대사(#talk = 얼굴 + 말풍선)와 결재 도장(.stamp)을 그대로 옮겨 왔다.
   굵은 검은 테두리 + 흐리지 않은 하드 섀도우 + 납작한 색.

   겹은 셋이다.
     stBg    코드로 그린 만화풍 연구실
     stFlash 도장이 찍힐 때 한 번 도는 빛
     stWrap  문서 + (얼굴 | 말풍선)
*/
#story{
  position:fixed;inset:0;z-index:58;overflow:hidden;cursor:pointer;
  background:#e8f2fa;-webkit-user-select:none;user-select:none;
}
#story[hidden]{display:none}
#stBg{position:absolute;inset:0}
#stBg svg{width:100%;height:100%;display:block}
#stBg.in{animation:stbgin .4s ease-out}
@keyframes stbgin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

#stFlash{position:absolute;inset:0;pointer-events:none;opacity:0}
#stFlash.no{background:var(--blood);animation:stflash .45s ease-out}
#stFlash.ok{background:var(--grass);animation:stflash .45s ease-out}
@keyframes stflash{0%{opacity:.4}100%{opacity:0}}
/* 루키랩 #stage.shake 와 같은 흔들림 */
#story.shake{animation:stshake .32s}
@keyframes stshake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-7px,4px)}
  40%{transform:translate(6px,-5px)}
  60%{transform:translate(-5px,-3px)}
  80%{transform:translate(4px,5px)}
}

#stWrap{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));
}
/* 가운데 맞춤을 align-items 로 하면 문서가 칸보다 길 때 위쪽이 잘려 못 읽는다.
   margin:auto 로 가운데에 두면 길어져도 스크롤로 닿는다. */
#stDoc{
  flex:1 1 auto;min-height:0;display:flex;overflow-y:auto;padding:4px 0 12px;
  scrollbar-width:none;
}
#stDoc::-webkit-scrollbar{display:none}

/* ---- 얼굴 + 말풍선 (루키랩 #talk 과 같은 짜임) ---- */
#stRow{
  flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:12px;
  width:min(900px,100%);margin:0 auto;
}
#stChar{
  flex:0 0 auto;width:clamp(64px,9vw,104px);height:clamp(64px,9vw,104px);
  border:var(--l) solid var(--ink);border-radius:18px;box-shadow:var(--sh);
  overflow:hidden;background:var(--sky);
}
#stChar[hidden]{display:none}
#stChar.in{animation:stpop .22s cubic-bezier(.3,1.5,.5,1)}
#stChar svg{width:100%;height:100%;display:block}
@keyframes stpop{from{transform:scale(.82) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

#stBox{
  position:relative;flex:1 1 auto;min-width:0;
  background:#fff;border:var(--l) solid var(--ink);border-radius:18px;box-shadow:var(--sh);
  padding:12px 15px 9px;
}
/* 말풍선 꼬리 — 얼굴 쪽을 가리킨다 */
#stBox::after{
  content:"";position:absolute;left:-17px;bottom:24px;width:0;height:0;
  border:9px solid transparent;border-right-color:var(--ink);
}
#stWho{display:block;font-size:12px;font-weight:900;color:#6b7280;margin-bottom:4px}
#stWho[hidden]{display:none}
#stName{font-size:13px;font-weight:900;color:var(--ink)}
#stRole{font-style:normal;margin-left:6px}
#stText{
  min-height:3.2em;font-size:15.5px;font-weight:700;line-height:1.62;
  color:var(--ink);word-break:keep-all;
}
#stText.nar{color:#6b7280}
#stText b{color:#c2410c}
/* 테두리 상자는 줄이 넘어가면 조각나 보인다. 색과 밑줄로 강조한다(공용.css 와 같은 규칙) */
#stText .hl{
  color:#0f5ba8;font-weight:900;
  text-decoration:underline;text-decoration-color:rgba(15,91,168,.32);
  text-decoration-thickness:3px;text-underline-offset:3px;
}
#stFoot{display:flex;align-items:center;gap:10px;margin-top:5px;min-height:26px}
#stCue{font-size:12px;font-weight:900;color:#9ca3af;animation:stblink 1.1s infinite}
@keyframes stblink{0%,100%{opacity:.3}50%{opacity:1}}
#stSkip{
  margin-left:auto;font-size:12px;font-weight:900;color:var(--ink);
  border:var(--l-sm) solid var(--ink);border-radius:11px;padding:5px 12px;
  background:var(--paper);box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
#stSkip:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

/* ---- 문서: 의뢰서와 보고서 ---- */
.stdoc{
  width:min(560px,100%);margin:auto;position:relative;
  background:var(--paper);color:var(--ink);
  border:var(--l) solid var(--ink);border-radius:18px;box-shadow:var(--sh);
  padding:15px 18px 14px;
  animation:stdocin .28s cubic-bezier(.3,1.4,.5,1);
  -webkit-user-select:text;user-select:text;
}
@keyframes stdocin{from{opacity:0;transform:translateY(14px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.stdoc .dtop{
  display:flex;align-items:center;gap:8px;
  border-bottom:var(--l-sm) solid var(--ink);padding-bottom:8px;margin-bottom:11px;
}
.stdoc .dmark{width:26px;height:26px;flex:0 0 auto;display:block}
.stdoc .dorg{font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
.stdoc .dkind{
  font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--ink);white-space:nowrap;
  background:var(--sun);border:2.5px solid var(--ink);border-radius:8px;padding:2px 9px;
}
.stdoc .dno{font-size:11px;color:#8b8272;margin-left:auto;font-weight:900;white-space:nowrap}
.stdoc h4{font-size:16.5px;font-weight:900;margin-bottom:10px;line-height:1.4}
.stdoc .dkv{
  display:flex;gap:10px;font-size:12.5px;font-weight:800;
  padding:4px 0;border-bottom:2px dashed #e0d8c2;
}
.stdoc .dkv span{flex:0 0 84px;color:#8b8272}
.stdoc .dkv+p{margin-top:12px}
.stdoc p{font-size:13.5px;font-weight:700;line-height:1.72;margin-bottom:9px;word-break:keep-all}
.stdoc p b{color:#1d4ed8}
/* 결재란 — 도장은 여기에 찍힌다. 자료를 가리지 않는다(루키랩 .stamp.sign 과 같은 뜻) */
.stdoc .dfoot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:12px;padding-top:9px;border-top:2px dashed #e0d8c2;min-height:52px;
}
.stdoc .dsign{font-size:12.5px;font-weight:900;color:#8b8272}
.dstampbox{flex:0 0 auto;width:112px;height:44px;position:relative}
.dstamp{
  position:absolute;left:50%;top:50%;
  padding:4px 13px;border:5px solid var(--blood);border-radius:12px;
  color:var(--blood);font-size:26px;font-weight:900;letter-spacing:.12em;
  background:rgba(255,255,255,.2);white-space:nowrap;
  animation:ststamp .46s cubic-bezier(.2,1.4,.4,1) both;
}
.dstamp.ok{border-color:#2b8a3e;color:#2b8a3e}
@keyframes ststamp{
  0%{transform:translate(-50%,-50%) rotate(-26deg) scale(3.2);opacity:0}
  55%{transform:translate(-50%,-50%) rotate(-13deg) scale(.92);opacity:1}
  75%{transform:translate(-50%,-50%) rotate(-13deg) scale(1.06)}
  100%{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:1}
}

/* ---- 안내 말풍선 안의 사수 얼굴과 「대화 다시 보기」 ---- */
#guideFace.svg::before,#guideFace.svg::after{display:none}
#guideFace svg{width:100%;height:100%;display:block}
#guideReplay{
  flex:0 0 auto;align-self:flex-start;
  font-size:11.5px;font-weight:900;color:var(--ink);white-space:nowrap;
  border:2.5px solid var(--ink);border-radius:10px;padding:4px 9px;
  background:#fff;box-shadow:var(--sh-sm);
  transition:transform .06s,box-shadow .06s;
}
#guideReplay:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

@media (max-width:900px){
  #stWrap{padding:10px}
  #stText{font-size:14.5px;min-height:4.2em}
  #stBox{padding:11px 13px 8px;border-radius:16px}
  #stRow{gap:9px}
  #stChar{width:clamp(56px,15vw,80px);height:clamp(56px,15vw,80px);border-radius:15px}
  #stBox::after{bottom:20px}
  .stdoc{padding:13px 14px 12px}
  .stdoc h4{font-size:15px}
  .stdoc p{font-size:13px}
  .stdoc .dkv span{flex:0 0 70px}
  /* 좁은 폭에서 머리글이 낱말 가운데서 끊긴다. 문서 번호만 아랫줄로 내린다 */
  .stdoc .dtop{flex-wrap:wrap;row-gap:5px}
  .stdoc .dorg{font-size:11px}
  .stdoc .dkind{font-size:11px;letter-spacing:.04em;padding:2px 7px}
  .stdoc .dno{margin-left:0;flex:1 1 100%;text-align:right}
  .dstampbox{width:92px;height:40px}
  .dstamp{font-size:21px;padding:3px 11px;border-width:4px}
}
/* 화면이 낮으면(가로로 든 폰) 얼굴을 줄인다 */
@media (max-height:460px){
  #stChar{width:clamp(52px,8vw,72px);height:clamp(52px,8vw,72px)}
  #stText{min-height:2.6em}
}
@media (prefers-reduced-motion:reduce){
  #stChar.in,#stBg.in,.stdoc,.dstamp{animation:none}
  #story.shake{animation:none}
}

/* ---- 선택지 ---- */
#stOpts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
#stOpts[hidden]{display:none}
.stOpt{
  font-size:14px;font-weight:900;color:var(--ink);background:var(--paper);
  border:var(--l-sm) solid var(--ink);border-radius:12px;padding:8px 13px;box-shadow:var(--sh-sm);
  cursor:pointer;transition:transform .06s,box-shadow .06s;animation:stpop .22s cubic-bezier(.3,1.5,.5,1) both;
  min-height:40px;
}
.stOpt:nth-child(2){animation-delay:.05s}.stOpt:nth-child(3){animation-delay:.1s}.stOpt:nth-child(4){animation-delay:.15s}
.stOpt:hover{background:var(--sun)}
.stOpt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
/* ---- 쪽지 ---- */
.stnote{
  width:min(380px,92%);margin:auto;position:relative;
  background:#fff3a8;color:var(--ink);border:var(--l) solid var(--ink);border-radius:6px;
  box-shadow:var(--sh);padding:14px 16px 12px;transform:rotate(-2deg);
  animation:stnotein .38s cubic-bezier(.3,1.5,.5,1);
}
.stnote::before{
  content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;
  background:var(--blood);border:3px solid var(--ink);border-radius:50%;
}
@keyframes stnotein{from{opacity:0;transform:rotate(6deg) translateY(-40px) scale(.9)}to{opacity:1;transform:rotate(-2deg)}}
.stnote .nfrom{font-size:12px;font-weight:900;color:#8b6b1f;display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.stnote .nfrom b{color:var(--ink);font-size:13.5px}
.stnote .nfrom span{margin-left:auto;font-size:11px;color:#8b6b1f}
.stnote p{font-size:15px;font-weight:800;line-height:1.55;word-break:keep-all}

</style>
</head>
<body>
<div id="app" aria-live="polite">
  <header id="bar">
    <div id="brand">
      <span id="badge">루키랩 시리즈</span>
      <h1 id="ttl">효모의 알코올발효 실험하기</h1>
      <span id="score" title="점수">0점</span>
    </div>
    <nav id="menu">
      <button type="button" data-modal="note" title="실험노트" aria-label="실험노트"><span class="mi">✎</span><span class="ml">실험노트</span></button>
      <button type="button" data-modal="wipe" id="btnWipe" title="처음부터 다시" aria-label="처음부터 다시"><span class="mi">↺</span><span class="ml">다시 하기</span></button>
      <details id="moreMenu"><summary aria-label="실험 메뉴">메뉴</summary><div class="menuItems">
      <button type="button" data-modal="about" title="실험 소개" aria-label="실험 소개"><span class="mi">i</span><span class="ml">실험 소개</span></button>
      <button type="button" data-modal="howto" title="사용법" aria-label="사용법"><span class="mi">?</span><span class="ml">사용법</span></button>
      <button type="button" id="btnSnd" title="효과음" aria-label="효과음"><span class="mi">♪</span><span class="ml">효과음</span></button>
      <button type="button" id="btnFull" title="전체화면" aria-label="전체화면"><span class="mi">⛶</span><span class="ml">전체화면</span></button>
      <button type="button" data-modal="wipe" title="처음부터 다시" aria-label="처음부터 다시"><span class="mi">↺</span><span class="ml">처음부터 다시</span></button>
      </div></details>
    </nav>
  </header>

  <div id="rail" role="navigation" aria-label="실험 진행 단계"></div>

  <main id="main">
    <section id="stage" aria-label="실험 무대"></section>
    <aside id="side">
      <div id="guide">
        <div id="guideFace" aria-hidden="true"></div>
        <div id="guideText"></div>
      </div>
      <div id="panel"></div>
      <div id="navbar">
        <button type="button" id="btnPrev">← 이전</button>
        <span id="stepno"></span>
        <button type="button" id="btnNext" class="primary">다음 →</button>
      </div>
    </aside>
  </main>

  <div id="toast" role="status"></div>
  <div id="veil" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>
/* ===== 가상실험실 스토리 레이어 — 루키랩 시리즈 =====
   12장면 코드는 그대로 두고, 그 위에 「왜 이 일을 하는가」를 얹는다.
   - 실험 모듈이 VLAB.def({ story:{...} }) 로 대본을 넘기면 켜진다.
   - 장면에 처음 들어갈 때 그 장면의 대사 묶음(beat)이 한 번 재생된다. 본 것은 D._story 에 남는다.
   - 주소에 ?nostory 를 붙이면 통째로 꺼진다. 검증 하네스가 쓴다.

   **그림은 앞서 만든 루키랩과 같은 손에서 나온 것으로 보이도록 그쪽 규칙을 그대로 따랐다.**
     굵은 검은 선(#181322) + 납작한 색 + 흐리지 않은 하드 섀도우
     얼굴은 루키랩 `faceSVG` 의 계보 그대로다. 사각 얼굴, 이마에 걸친 고글, 표정 다섯.
     표정 이름도 루키랩 것을 쓴다(calm smile angry shock wink).
     대본에서 serious surprise wry 로 적어도 각각 angry shock wink 로 받는다.
   그림 파일은 하나도 쓰지 않는다.

   대본 한 걸음(step) 은 다음 중 하나다.
     { w:'sup', f:'calm', t:'대사' }            말하기 (t 는 문자열 또는 function(E))
     { doc:{ ... } }                            문서 띄우기 (다음 문서까지 남는다)
     { stamp:'반려' | '승인' }                   문서 결재란에 도장 (스스로 넘어간다)
     { clear:1 }                                문서 치우기
     { note:{from,at,t}, w,f,t }                쪽지 (작은 메모가 붙는다. t 가 없으면 지문 한 줄)
     { w,f, ask:'질문', k:'키', opts:[{t,r:[…]}] } 선택지. 고른 것의 r 이 끼어든다. D._pick[k] 에 남는다
   어느 걸음에나 { bg:'office' } 를 얹으면 배경이 바뀌고 그다음까지 이어진다.
*/
(function (global) {
'use strict';

var E = null, S = null, node = null;
var seq = [], step = 0, typer = null, doneFn = null, playing = false;
var full = '', shown = 0, curBg = null, curWho = null;

var OFF = /[?&]nostory\b/.test(global.location.search);
var INK = '#181322';

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ================================================================
   1. 배경 — 만화풍 연구실
   ---------------------------------------------------------------
   루키랩 `배경.js` 와 같은 색을 쓴다. 벽 #e8f2fa, 창 #bfe9ff, 선반 #c9a227.
   고정 viewBox 를 잘라 채우면 폰(세로)에서 방이 무엇인지 안 보이므로
   화면 크기를 받아 자리를 폭과 높이의 비로 잡는다.
   ================================================================ */
function box(x, y, w, h, fill, lw, r) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (r || 0) + '" fill="' + fill + '"' +
    (lw ? ' stroke="' + INK + '" stroke-width="' + lw + '" stroke-linejoin="round"' : '') + '/>';
}
function line(d, lw) {
  return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + lw +
    '" stroke-linecap="round" stroke-linejoin="round"/>';
}
function txt(x, y, s, size, col, anchor) {
  return '<text x="' + x + '" y="' + y + '" fill="' + (col || INK) + '" font-size="' + size +
    '" font-weight="900" font-family="sans-serif"' +
    (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + s + '</text>';
}
/* 시약병 하나 — 루키랩 bottle() 과 같은 짜임 */
function bottle(x, y, w, h, col, lw) {
  return box(x, y + h * 0.22, w, h * 0.78, '#eef6fb', lw, w * 0.2) +
    box(x + w * 0.12, y + h * 0.56, w * 0.76, h * 0.4, col, 0, w * 0.14) +
    box(x + w * 0.3, y, w * 0.4, h * 0.24, '#cbd5e1', lw, 2) +
    box(x + w * 0.22, y - h * 0.1, w * 0.56, h * 0.13, INK, lw, 2);
}
/* 삼각 플라스크 */
function flask(cx, base, s, col, lw, id) {
  var d = 'M' + (cx - 4 * s) + ' ' + (base - 48 * s) + ' V' + (base - 30 * s) +
          ' L' + (cx - 17 * s) + ' ' + (base - 6 * s) +
          ' Q' + (cx - 20 * s) + ' ' + base + ' ' + (cx - 13 * s) + ' ' + base +
          ' H' + (cx + 13 * s) +
          ' Q' + (cx + 20 * s) + ' ' + base + ' ' + (cx + 17 * s) + ' ' + (base - 6 * s) +
          ' L' + (cx + 4 * s) + ' ' + (base - 30 * s) + ' V' + (base - 48 * s) + ' Z';
  return '<clipPath id="' + id + '"><path d="' + d + '"/></clipPath>' +
    '<path d="' + d + '" fill="#eef6fb" stroke="' + INK + '" stroke-width="' + lw +
      '" stroke-linejoin="round"/>' +
    '<rect x="' + (cx - 22 * s) + '" y="' + (base - 18 * s) + '" width="' + (44 * s) +
      '" height="' + (20 * s) + '" fill="' + col + '" clip-path="url(#' + id + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + lw +
      '" stroke-linejoin="round"/>' +
    line('M' + (cx - 6 * s) + ' ' + (base - 50 * s) + ' h' + (12 * s), lw);
}

var BG = {
  /* 실험대 — 시약 선반과 실험대가 있는 곳 */
  bench: function (w, h, u) {
    var lw = Math.max(2.4, u * 0.7);
    var shelf = h * 0.44, top = h * 0.72;
    var s = '<rect width="' + w + '" height="' + h + '" fill="#e8f2fa"/>';
    /* 벽에 붙인 쪽지 — **편마다 다르다.** 실험 모듈이 story.poster 로 준다.
       예전에는 영양소 편의 「아이오딘 → 청람색」이 일곱 편에 다 걸려 있었다. */
    var po = (S && S.poster) || { t: '실험실 수칙',
      rows: [['#2b3a8f', '이름을 확인하고 쓴다'], ['#c9342b', '쓴 것은 제자리에']] };
    /* 삼각 플라스크 목이 벽보 아래쪽을 가로질러 글을 긋던 것 — 조금 올리고 낮춘다 */
    var nx = w * 0.05, nw = Math.min(w * 0.42, u * 48), ny = h * 0.06, nh = u * 18;
    s += box(nx, ny, nw, nh, '#fffdf5', lw, u * 1.8);
    s += txt(nx + u * 3, ny + nh * 0.3, esc(po.t), u * 4.4);
    /* 글이 길면 글자를 줄여 상자 안에 맞춘다. 한글은 글자 폭이 크기의 0.95배쯤 */
    var room = nw - u * 11, longest = 0;
    (po.rows || []).forEach(function (r) { longest = Math.max(longest, String(r[1]).length); });
    var fs = longest ? Math.min(u * 3.8, room / (longest * 0.95)) : u * 3.8;
    (po.rows || []).slice(0, 2).forEach(function (r, i) {
      s += box(nx + u * 3, ny + nh * (0.44 + i * 0.24), u * 3.4, u * 3.4, r[0], lw * 0.6, 1);
      s += txt(nx + u * 8, ny + nh * (0.62 + i * 0.24), esc(r[1]), fs);
    });
    /* 안전 액자 */
    var fx = w * 0.74, fw = Math.min(w * 0.2, u * 22);
    s += box(fx, ny, fw, fw * 0.78, '#fff', lw, u * 1.8);
    s += txt(fx + fw / 2, ny + fw * 0.36, '안전', u * 6, '#ff5c5c', 'middle');
    s += txt(fx + fw / 2, ny + fw * 0.62, '제일', u * 4.6, INK, 'middle');
    /* 선반과 시약병 */
    s += box(w * 0.05, shelf, w * 0.9, u * 3.2, '#c9a227', lw, 2);
    var bw = u * 6, gap = u * 3.6, x = w * 0.09, i = 0;
    var cols = ['#8b6b1f', '#c9342b', '#4cc9f0', '#9b6dff', '#5fd68a', '#f0a71a'];
    while (x + bw < w * 0.93) {
      s += bottle(x, shelf - u * 11, bw, u * 11, cols[i % cols.length], lw);
      x += bw + gap; i++;
    }
    /* 실험대 */
    s += box(-lw, top, w + lw * 2, u * 4, '#e6d8b8', lw, 2);
    s += box(-lw, top + u * 4, w + lw * 2, h - top, '#cbb98f', lw, 0);
    s += flask(w * 0.2, top, u * 0.9, '#5fd68a', lw, 'fkA');
    s += flask(w * 0.32, top, u * 0.68, '#4cc9f0', lw, 'fkB');
    /* 만화풍 현미경 */
    var mx = w * 0.8, mb = top;
    s += box(mx - u * 8, mb - u * 2.4, u * 16, u * 2.4, '#8f9bb3', lw, 2);
    s += box(mx + u * 2, mb - u * 12, u * 2.8, u * 10, '#8f9bb3', lw, 1);
    s += box(mx - u * 2.4, mb - u * 20, u * 5.6, u * 9.4, '#b9c4d8', lw, u * 1.8);
    s += box(mx - u * 6, mb - u * 8.4, u * 13, u * 2.2, '#8f9bb3', lw, 1);
    return s;
  },

  /* 사무 공간 — 의뢰서가 오가는 곳 */
  office: function (w, h, u) {
    var lw = Math.max(2.4, u * 0.7);
    var desk = h * 0.74;
    var s = '<rect width="' + w + '" height="' + h + '" fill="#e8f2fa"/>';
    /* 창 */
    var ww = Math.min(w * 0.36, u * 44), wh = Math.min(h * 0.38, u * 38);
    var wx = w * 0.58, wy = h * 0.1;
    s += box(wx, wy, ww, wh, '#bfe9ff', lw, u * 2);
    s += '<clipPath id="stwin"><rect x="' + wx + '" y="' + wy + '" width="' + ww +
      '" height="' + wh + '" rx="' + (u * 2) + '"/></clipPath>';
    s += '<g clip-path="url(#stwin)">';
    for (var i = -2; i < 6; i++) {
      var sx = wx + i * ww * 0.32;
      s += '<rect x="' + sx + '" y="' + (wy - wh) + '" width="' + (ww * 0.11) +
        '" height="' + (wh * 3) + '" fill="rgba(255,255,255,.55)" transform="rotate(-28 ' +
        sx + ' ' + wy + ')"/>';
    }
    s += '<circle cx="' + (wx + ww * 0.3) + '" cy="' + (wy + wh * 0.9) + '" r="' + (ww * 0.24) + '" fill="#8fd6a0"/>';
    s += '<circle cx="' + (wx + ww * 0.64) + '" cy="' + (wy + wh * 0.95) + '" r="' + (ww * 0.18) + '" fill="#8fd6a0"/>';
    s += '</g>';
    s += line('M' + (wx + ww / 2) + ' ' + wy + ' V' + (wy + wh) +
              'M' + wx + ' ' + (wy + wh / 2) + ' H' + (wx + ww), lw);
    /* 게시판 */
    var bx = w * 0.05, bw = Math.min(w * 0.4, u * 44), by = h * 0.12, bh = Math.min(h * 0.3, u * 30);
    s += box(bx, by, bw, bh, '#fffdf5', lw, u * 2);
    var pw = bw * 0.24, ph = bh * 0.3;
    var pin = [[0.06, 0.1], [0.37, 0.16], [0.68, 0.08], [0.1, 0.55], [0.48, 0.6]];
    var pc = ['#fff', '#ffe9a8', '#fff', '#dff3ff', '#ffe0e0'];
    for (var k = 0; k < pin.length; k++) {
      s += box(bx + bw * pin[k][0] + bw * 0.03, by + bh * pin[k][1] + bh * 0.06,
               pw, ph, pc[k], lw * 0.7, 2);
    }
    /* 벽시계 */
    var cx = w * 0.48, cy = h * 0.16, r = u * 7;
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fff" stroke="' + INK +
      '" stroke-width="' + lw + '"/>';
    s += line('M' + cx + ' ' + cy + ' V' + (cy - r * 0.62) + 'M' + cx + ' ' + cy +
              ' l' + (r * 0.5) + ' ' + (r * 0.28), lw * 0.85);
    /* 책상 */
    s += box(-lw, desk, w + lw * 2, u * 4, '#e6d8b8', lw, 2);
    s += box(-lw, desk + u * 4, w + lw * 2, h - desk, '#cbb98f', lw, 0);
    /* 책상 위 서류 더미와 결재함 */
    s += box(w * 0.1, desk - u * 3, w * 0.2, u * 3, '#fff', lw, 1);
    s += box(w * 0.115, desk - u * 5.6, w * 0.2, u * 3, '#fffdf5', lw, 1);
    s += box(w * 0.09, desk - u * 8.2, w * 0.2, u * 3, '#fff', lw, 1);
    s += box(w * 0.74, desk - u * 8, w * 0.16, u * 8, '#f0a71a', lw, u * 1.4);
    s += line('M' + (w * 0.76) + ' ' + (desk - u * 5) + ' h' + (w * 0.12), lw * 0.8);
    return s;
  }
};

function bgSVG(kind, w, h) {
  var fn = BG[kind] || BG.bench;
  var u = Math.min(w, h) / 100;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    fn(w, h, u) + '</svg>';
}

/* ================================================================
   2. 얼굴 — 루키랩 faceSVG 의 계보 그대로
   ---------------------------------------------------------------
   76 x 76 사각. 이마에 고글을 걸치고 있다. 표정은 눈썹, 눈, 입만 갈아 끼운다.
   사람마다 다른 것은 배경색, 머리색, 머리 모양 셋뿐이다.
   ================================================================ */
var MOOD_ALIAS = { serious: 'angry', surprise: 'shock', wry: 'wink' };

function moodParts(mood) {
  var eye, mouth, brow = '';
  if (mood === 'smile') {
    eye = '<path d="M20 34 q6 -8 12 0" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M44 34 q6 -8 12 0" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
    mouth = '<path d="M28 50 q10 12 20 0" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
  } else if (mood === 'angry') {
    eye = '<circle cx="26" cy="34" r="4.5" fill="' + INK + '"/><circle cx="50" cy="34" r="4.5" fill="' + INK + '"/>';
    brow = '<path d="M18 24 l14 6 M58 24 l-14 6" stroke="' + INK + '" stroke-width="4.5" stroke-linecap="round"/>';
    mouth = '<path d="M28 54 q10 -8 20 0" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
  } else if (mood === 'shock') {
    eye = '<circle cx="26" cy="33" r="6.5" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
          '<circle cx="26" cy="33" r="2.6" fill="' + INK + '"/>' +
          '<circle cx="50" cy="33" r="6.5" fill="#fff" stroke="' + INK + '" stroke-width="3"/>' +
          '<circle cx="50" cy="33" r="2.6" fill="' + INK + '"/>';
    mouth = '<ellipse cx="38" cy="53" rx="7" ry="9" fill="' + INK + '"/>';
  } else if (mood === 'wink') {
    eye = '<path d="M20 34 q6 -8 12 0" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="34" r="4.5" fill="' + INK + '"/>';
    mouth = '<path d="M28 50 q10 10 20 -2" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
  } else {
    eye = '<circle cx="26" cy="34" r="4.5" fill="' + INK + '"/><circle cx="50" cy="34" r="4.5" fill="' + INK + '"/>';
    mouth = '<path d="M30 52 h16" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/>';
  }
  return brow + eye + mouth;
}

var HAIR = {
  /* 사수 — 루키랩과 같은 머리 */
  neat: function (c) {
    return '<path d="M10 36 q2 -30 28 -30 t28 30 q-6 -12 -14 -14 q-8 8 -22 6 q-12 -2 -20 8z" fill="' + c +
      '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
  },
  /* 앞머리가 뻗친 머리 */
  /* 단발 — 옆머리가 뺨까지 내려온다. 고글 없는 의뢰인용 */
  bob: function (c) {
    return '<path d="M6 56 V38 Q6 5 38 5 T70 38 V56 H61 V41 Q61 21 38 21 T15 41 V56 Z" fill="' + c +
      '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
  },
  /* 묶은 머리 — 단정한 머리에 옆으로 묶음 하나 */
  bun: function (c) {
    return '<path d="M10 36 q2 -30 28 -30 t28 30 q-6 -12 -14 -14 q-8 8 -22 6 q-12 -2 -20 8z" fill="' + c +
      '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="67" cy="22" r="8" fill="' + c + '" stroke="' + INK + '" stroke-width="3"/>';
  },
  /* 가르마 — 옆으로 넘긴 짧은 머리. 시범하는 선생님 */
  part: function (c) {
    return '<path d="M9 40 q0 -34 29 -34 q24 0 29 26 q-9 -14 -27 -12 q-14 2 -21 10 q-6 4 -10 10z" fill="' + c +

/* 무대 안 말풍선을 어느 귀에 붙일지 고른다.
   말풍선 크기만 한 상자를 네 귀에서 떠 칠해진 화소 비율을 세고 **가장 빈 귀**를 고른다.
   같은 수법을 검사(`hintEdge`)가 이미 쓰고 있다. 못 재면 오른쪽 위(예전 자리). */
function sayCorner(node, play) {
  var pick = 'tr';
  try {
    var cv = play.querySelector('canvas:not(.fxc)');
    if (cv && cv.width > 60 && cv.height > 60) {
      var ctx = cv.getContext('2d');
      var r = cv.width / (cv.clientWidth || cv.width);          /* 실제 화소 비 */

      for (var k in box) {
        var x = Math.max(0, Math.round(box[k][0])), y = Math.max(0, Math.round(box[k][1]));
        var ww = Math.max(1, Math.min(Math.round(bw), cv.width - x));
        var hh = Math.max(1, Math.min(Math.round(bh), cv.height - y));

}

/* ---------------- 진행 레일 ---------------- */
function drawRail() {
  var r = $('#rail'); r.innerHTML = '';
  var chaps = [], seen = {};
  SC.forEach(function (s, i) {
    if (!seen[s.chap]) { seen[s.chap] = { name: s.chap, from: i, to: i }; chaps.push(seen[s.chap]); }
    else seen[s.chap].to = i;
  });
  chaps.forEach(function (c, n) {
    var st = idx > c.to ? 'fin' : (idx >= c.from ? 'on' : '');
    var b = el('button', { cls: 'rl ' + st, type: 'button' },
      el('span', { cls: 'dot' }, el('span', { text: String(n + 1) })),
      el('span', { text: c.name }));
    b.addEventListener('click', function () {
      if (c.from <= maxSeen()) go(c.from);
      else E.toast('앞 단계를 먼저 마쳐야 해요', 'bad');
    });
    r.appendChild(b);
  });
  var on = $('.rl.on', r);
  if (on) { var l = on.offsetLeft - r.clientWidth / 2 + on.offsetWidth / 2; r.scrollTo({ left: Math.max(0, l), behavior: 'smooth' }); }
}
function maxSeen() { D._max = Math.max(D._max || 0, idx); return D._max; }

/* 지금 무대에 살아 있는 캔버스들 */
var LIVE = [];
function refitAll() { LIVE.forEach(function (c) { try { c.refit && c.refit(); } catch (e) {} }); }
/* 검사용 — 살아 있는 캔버스를 지금 크기로 한 번 다시 그린다. 헤드리스 크롬은 rAF 가 거의 안 돌아
   장면이 상태를 바꾼 뒤의 좌표(연필 자리 등)가 안 잡힌다. 검사가 누른 뒤에 이걸 부른다 */
E.repaint = refitAll;

/* ---------------- 장면 전환 ---------------- */
function go(n, quiet) {
  n = clamp(n, 0, SC.length - 1);
  if (DEMO.on && !DEMO.remount) demoEnd(false, true);
  if (PHOTO.el) photoClose(true);
  E.photoOffer([]);
  if (cur && cur.unmount) { try { cur.unmount(); } catch (e) {} }
  loops.forEach(function (o) { o.stop(); }); loops = [];
  idx = n; cur = SC[idx]; maxSeen();
  funReset();
  var stage = $('#stage'), panel = $('#panel');
  stage.innerHTML = ''; panel.innerHTML = '';
  panel.scrollTop = 0;
  /* 무대는 이제 **세로 두 칸**이다 — 위 #play(그림), 아래 #ctrl(조작판).
     장면에는 #play 를 「무대」로 넘긴다. 캔버스도 안내 띠도 그 안에 담긴다.
     브라우저가 한 번에 자리를 잡으므로 캔버스 크기가 도중에 흔들리지 않는다. */
  /* 무대를 비우면 지난 장면의 캔버스는 그냥 버려진다(stop 을 안 부르는 장면도 있다).
     목록에 남겨 두면 없는 것을 다시 재려 든다. 여기서 비운다. */
  LIVE.length = 0;
  var play = el('div'); play.id = 'play';
  stage.appendChild(play);
  bigMake(play);
  makeCtrl(stage);
  qzMake(stage);
  E.gate(true);
  E.guide(cur.guide || '');
  E.sceneId = cur.id; E.sceneIdx = idx; E.sceneCount = SC.length; E.drawError = null;
  $('#stepno').innerHTML = '<span class="sn">' + (idx + 1) + ' / ' + SC.length + '</span><span class="sp"></span>';
  scorePaint(false);
  E.sceneNames = SC.map(function (s) { return s.name || s.id; });
  if (!DEMO.remount) submitHook('go', { idx: idx, id: cur.id, name: cur.name });
  $('#btnPrev').disabled = idx === 0;
  $('#btnNext').textContent = idx === SC.length - 1 ? '마침' : '다음 →';
  try {
    cur.mount(play, panel);
    /* **첫 가르기는 기다리지 않고 바로 한다.**
       지켜보다 다음 프레임에 가르면, 그 한 프레임 동안 조작판이 비어 있어 그림이 무대를 다 쓰다가
       카드가 들어오는 순간 줄어든다. 그 틈에 장면이 잡아 둔 hit 상자는 **줄기 전 크기**라
       거기를 누르면 빗나간다. 검사가 돌릴 때마다 됐다 안 됐다 한 까닭이 이것이었고,
       학생에게도 첫 손짓이 한 번 헛나가는 것으로 나타난다. */
    splitPanel(true);
    sizeCtrlOnce();
    /* 카드가 무대 안으로 들어오며 캔버스가 줄었다. **줄어든 크기로 다시 재게 한다.**
       안 그러면 장면이 옛 크기로 그려 누르는 자리가 어긋난다. */
    refitAll();
